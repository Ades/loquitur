<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loquitur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --font-title:'Cinzel',serif;
    --font-text:'Spectral',serif;
    --bg:#181310;
    --bg-panel:#221b15;
    --bg-panel-raised:#2a2118;
    --line:#3a2f22;
    --parchment:#ece1c4;
    --parchment-dim:#b6a880;
    --brass:#c9a24b;
    --brass-dim:#8c7431;
    --brass-bright:#e2bc63;
    --locked:#4a4038;
    --locked-line:#3a3128;
    --moss:#6f8a53;
    --moss-dim:#4c5f3a;
    --wine:#8a3a3a;
    --bg-glow:#23190f;
    --shadow: 0 8px 24px rgba(0,0,0,.45);
    --radius: 3px;
  }
  body.light{
    --bg:#f3ead2;
    --bg-panel:#fdf8ea;
    --bg-panel-raised:#f6efd9;
    --line:#dbc99c;
    --parchment:#2b2013;
    --parchment-dim:#6e5c3c;
    --brass:#8a6114;
    --brass-dim:#a9812c;
    --brass-bright:#6b480d;
    --locked:#a89872;
    --locked-line:#e6d9b3;
    --moss:#4b6b34;
    --moss-dim:#6f8a53;
    --wine:#8a3a3a;
    --bg-glow:#fffaf0;
    --shadow: 0 8px 20px rgba(60,45,20,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, var(--bg-glow) 0%, var(--bg) 55%),
      var(--bg);
    color:var(--parchment);
    font-family:var(--font-text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background-color .2s, color .2s;
  }
  h1 { font-family: "Kimberley", sans-serif }
  @font-face {
      font-family: "Arkhamslim";
      src: url(public/fonts/arkhamslim.ttf) format("truetype");
  }
  .arkhamslim{
      color:var(--parchment);
      font-family:'Arkhamslim';
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      transition:background-color .2s, color .2s;
  }
  ::selection{background:var(--brass-dim);color:#000;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--brass-dim);
  }
  h1,h2,h3{font-family:var(--font-title);font-weight:600;margin:0;letter-spacing:.02em;}
  button{font-family:var(--font-text);cursor:pointer;}
  a{color:var(--brass);}

  #app{max-width:1180px;margin:0 auto;padding:18px 18px 56px;}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap;gap:14px;
  }
  header.top .brand{display:flex;align-items:center;gap:14px;}
  header.top .brand svg{flex:none;}
  header.top h1{font-size:22px;color:var(--parchment);}
  header.top .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--parchment-dim);letter-spacing:.08em;margin-top:2px;}
  .top-actions{display:flex;gap:10px;align-items:center;}

  .btn{
    background:transparent;border:1px solid var(--brass-dim);color:var(--brass-bright);
    padding:9px 16px;border-radius:var(--radius);font-size:13px;letter-spacing:.03em;
    transition:background .15s,color .15s,border-color .15s;
  }
  .btn:hover{background:var(--brass-dim);color:#161109;}
  .btn.primary{background:var(--brass);color:#161109;border-color:var(--brass);font-weight:600;}
  .btn.primary:hover{background:var(--brass-bright);border-color:var(--brass-bright);}
  .btn.ghost{border-color:var(--line);color:var(--parchment-dim);}
  .btn.ghost:hover{border-color:var(--parchment-dim);color:var(--parchment);background:transparent;}
  .btn.danger{border-color:var(--wine);color:#d99;}
  .btn.danger:hover{background:var(--wine);color:#fff;}
  .btn.small{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn:disabled:hover{background:transparent;color:var(--brass-bright);}
  .btn svg{vertical-align:-2px;margin-right:5px;}

  .library-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .game-card{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;position:relative;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .game-card:hover{transform:translateY(-3px);border-color:var(--brass-dim);box-shadow:var(--shadow);}
  .game-card .art{
    height:104px;background:linear-gradient(160deg,#2c2318,#181310) center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;color:var(--locked);
    border-bottom:1px solid var(--line);
  }
  .game-card .body{padding:10px 12px 12px;}
  .game-card h3{font-size:15px;color:var(--parchment);margin-bottom:4px;}
  .game-card p{font-size:12px;color:var(--parchment-dim);margin:0 0 8px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .game-card .stat-row{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass-dim);
    letter-spacing:.05em;display:flex;justify-content:space-between;}
  .add-card{
    border:1px dashed var(--line);border-radius:var(--radius);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;min-height:104px;color:var(--parchment-dim);
    cursor:pointer;transition:border-color .15s,color .15s;
  }
  .add-card:hover{border-color:var(--brass-dim);color:var(--brass-bright);}
  .empty{border:1px dashed var(--line);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--parchment-dim);}
  .empty h3{color:var(--parchment);margin-bottom:6px;font-size:15px;}

  .crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12.5px;color:var(--parchment-dim);}
  .crumb button{background:none;border:none;color:var(--brass);font-size:12.5px;padding:0;}
  .game-header{display:flex;gap:14px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
  .game-header .art{
    width:64px;height:64px;border-radius:var(--radius);background:linear-gradient(160deg,#2c2318,#181310) center/cover no-repeat;
    border:1px solid var(--line);flex:none;
  }
  .game-header .meta{flex:1;min-width:220px;}
  .game-header h2{font-size:20px;color:var(--parchment);margin-bottom:3px;}
  .game-header .desc{color:var(--parchment-dim);font-size:13px;max-width:60ch;line-height:1.5;margin:0 0 6px;}
  .game-header .desc p{margin:0 0 6px;}
  .game-header .desc p:last-child{margin-bottom:0;}
  .progress-bar{height:4px;background:var(--locked-line);border-radius:3px;overflow:hidden;max-width:320px;margin-top:6px;}
  .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass-bright));}
  .progress-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass-dim);margin-top:4px;letter-spacing:.05em;}

  .toolbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:12px;}
  .view-toggle{display:flex;gap:6px;}
  .view-toggle button{
    background:transparent;border:1px solid var(--line);color:var(--parchment-dim);
    padding:7px 14px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;
    border-radius:var(--radius);
  }
  .view-toggle button.active{border-color:var(--brass);color:var(--brass-bright);}
  .setting-toggle{
    display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    color:var(--parchment-dim);letter-spacing:.03em;cursor:pointer;user-select:none;
  }
  .setting-toggle input{accent-color:var(--brass);width:14px;height:14px;}

  .node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .node-card{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;
    cursor:pointer;transition:border-color .15s,transform .15s;position:relative;
  }
  .node-card:hover{border-color:var(--brass-dim);transform:translateY(-2px);}
  .node-card.completed{border-color:var(--moss-dim);}
  .node-card .tag{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    display:inline-block;padding:2px 6px;border-radius:2px;margin-bottom:7px;
  }
  .node-card.completed .tag{background:rgba(111,138,83,.18);color:var(--moss);}
  .node-card.available .tag{background:rgba(201,162,75,.15);color:var(--brass);}
  .node-card h3{font-size:14.5px;color:var(--parchment);margin-bottom:4px;line-height:1.3;}
  .node-card .node-card-text{font-size:12px;color:var(--parchment-dim);line-height:1.45;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .node-card .node-card-text p{margin:0;}
  .node-card .node-card-text ul{margin:0 0 0 1.1em;padding:0;}
  .node-card .node-card-text code{background:var(--bg-panel-raised);padding:0 3px;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:.92em;}
  .node-card .icon-row{position:absolute;top:11px;right:11px;color:var(--brass-dim);}
  .mini-play{
    position:absolute;bottom:10px;right:10px;width:26px;height:26px;border-radius:50%;
    background:var(--brass);color:#161109;display:flex;align-items:center;justify-content:center;
    border:none;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3);
    transition:transform .12s ease, background .15s ease;
  }
  .mini-play:hover{transform:scale(1.08);background:var(--brass-bright);}
  .mini-play.playing{background:var(--moss);}
  .mini-play svg{display:block;margin:0;}
  .locked-note{
    grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--locked);
    border-top:1px dashed var(--line);padding-top:10px;margin-top:2px;letter-spacing:.03em;
    display:flex;align-items:center;gap:8px;
  }

  .log-list{display:flex;flex-direction:column;gap:8px;}
  .log-item{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 13px;
  }
  .log-item .log-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .log-item .log-title{font-family:'Cinzel',serif;font-size:13.5px;color:var(--parchment);}
  .log-item .log-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass-dim);white-space:nowrap;letter-spacing:.03em;}
  .log-item .log-choice{font-size:12px;color:var(--brass);margin-top:3px;}
  .log-item .log-result{font-size:12px;color:var(--parchment-dim);font-style:italic;margin-top:3px;line-height:1.5;}
  .log-item .log-result p{margin:0;}

  .map-wrap{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;overflow:auto;}
  .map-wrap svg{display:block;}
  .map-node-label{font-family:'IBM Plex Mono',monospace;fill:var(--parchment);}
  .map-hint{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass-dim);margin-bottom:8px;letter-spacing:.03em;}

  .reader-overlay{
    position:fixed;inset:0;background:rgba(10,8,6,.72);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  @keyframes modalFadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes modalPopIn{ from{opacity:0;transform:scale(.94) translateY(10px);} to{opacity:1;transform:scale(1) translateY(0);} }
  .reader-overlay.anim-in{ animation:modalFadeIn .16s ease-out; }
  .reader-overlay.anim-in > .reader{ animation:modalPopIn .22s cubic-bezier(.2,.8,.3,1); }
  @keyframes unlockPulse{
    0%{ opacity:.25; transform:scale(.93); box-shadow:0 0 0 0 rgba(201,162,75,.55); }
    55%{ opacity:1; box-shadow:0 0 0 9px rgba(201,162,75,0); }
    100%{ opacity:1; transform:scale(1); box-shadow:0 0 0 0 rgba(201,162,75,0); }
  }
  .node-card.newly-unlocked{ animation:unlockPulse .9s ease-out; }
  @keyframes unlockPulseSvg{
    0%{ opacity:.2; transform:scale(.55); }
    55%{ opacity:1; transform:scale(1.25); }
    100%{ opacity:1; transform:scale(1); }
  }
  .map-node.newly-unlocked{ animation:unlockPulseSvg .8s ease-out; transform-box:fill-box; transform-origin:center; }
  .reader{
    background:var(--bg-panel);border:1px solid var(--brass-dim);border-radius:var(--radius);
    width:96vw;max-width:96vw;height:92vh;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .reader .art{width:100%;height:220px;background:linear-gradient(160deg,#2c2318,#181310) center/cover no-repeat;border-bottom:1px solid var(--line);}
  .reader .content{padding:24px 32px 32px;max-width:900px;margin:0 auto;}
  .reader h2{font-size:19px;color:var(--parchment);margin-bottom:10px;}
  .reader .close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.4);border:1px solid var(--line);
    color:var(--parchment-dim);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;display:flex;
    align-items:center;justify-content:center;}
  .reader-relative{position:relative;}
  .reader .body-text{font-size:15.5px;line-height:1.75;color:var(--parchment);margin-bottom:20px;}
  .body-text p, .result-text p{margin:0 0 10px;}
  .body-text p:last-child, .result-text p:last-child{margin-bottom:0;}
  .body-text ul, .result-text ul{margin:0 0 10px 1.2em;padding:0;}
  .body-text code, .result-text code{background:var(--bg-panel-raised);padding:1px 5px;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:.9em;}
  .body-text a, .result-text a{color:var(--brass);text-decoration:underline;}
  audio{width:100%;margin-bottom:18px;filter:sepia(.2);}
  .custom-audio-player{
    display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:10px 14px;
    border-radius:var(--radius);background:var(--bg-panel-raised);border:1px solid var(--line);
  }
  .custom-audio-player .cap-play{
    flex:none;width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
    background:var(--brass);color:#161109;display:flex;align-items:center;justify-content:center;
    transition:transform .1s ease,background .15s ease;
  }
  .custom-audio-player .cap-play:hover{transform:scale(1.06);background:var(--brass-bright);}
  .custom-audio-player .cap-play svg{width:14px;height:14px;}
  .custom-audio-player .cap-progress-track{
    flex:1;height:6px;background:var(--locked-line);border-radius:4px;cursor:pointer;position:relative;overflow:hidden;
  }
  .custom-audio-player .cap-progress-fill{height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass-bright));width:0%;}
  .custom-audio-player .cap-time{flex:none;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--parchment-dim);letter-spacing:.03em;}
  .custom-audio-player.style-minimal{padding:4px 2px;background:transparent;border:none;gap:9px;}
  .custom-audio-player.style-minimal .cap-play{width:24px;height:24px;background:transparent;border:1px solid var(--line);color:var(--parchment-dim);}
  .custom-audio-player.style-minimal .cap-play:hover{background:var(--bg-panel-raised);}
  .custom-audio-player.style-minimal .cap-progress-track{height:3px;background:var(--line);}
  .custom-audio-player.style-brass{
    background:linear-gradient(160deg,var(--bg-panel-raised),var(--bg-panel));border:1px solid var(--brass-dim);padding:13px 16px;
  }
  .custom-audio-player.style-brass .cap-play{width:44px;height:44px;box-shadow:0 3px 8px rgba(0,0,0,.35);}
  .custom-audio-player.style-brass .cap-play svg{width:16px;height:16px;}
  .custom-audio-player.style-brass .cap-progress-track{height:9px;border-radius:6px;}
  .custom-audio-player.style-brass .cap-time{font-size:11.5px;color:var(--brass-dim);}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .choice-btn{
    text-align:left;background:var(--bg-panel-raised);border:1px solid var(--line);color:var(--parchment);
    padding:12px 14px;border-radius:var(--radius);font-size:14px;transition:border-color .15s,background .15s;
  }
  .choice-btn:hover{border-color:var(--brass);background:#2f2519;}
  .reader-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .completed-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--moss);letter-spacing:.05em;}
  .result-box{
    background:var(--bg-panel-raised);border:1px solid var(--brass-dim);border-radius:var(--radius);
    padding:16px;margin-top:8px;
  }
  .result-box .result-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass);letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase;}
  .result-box .result-text{font-size:14.5px;line-height:1.7;color:var(--parchment);margin-bottom:14px;}

  .manage-panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .manage-panel h3{color:var(--brass-bright);font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;
    color:var(--parchment-dim);margin-bottom:6px;text-transform:uppercase;}
  .field input[type=text], .field textarea, .field input[type=url]{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--parchment);
    padding:10px 12px;border-radius:var(--radius);font-family:'Spectral',serif;font-size:14px;
  }
  .field textarea{min-height:80px;resize:vertical;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--brass-dim);}
  .path-picker-row{display:flex;gap:8px;align-items:stretch;}
  .path-picker-row input[type=text]{flex:1;}
  .path-picker-row .btn{flex:none;white-space:nowrap;}
  .field-row{display:flex;gap:14px;flex-wrap:wrap;}
  .field-row .field{flex:1;min-width:220px;}
  .media-toggle{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .media-toggle button{
    font-size:11px;font-family:'IBM Plex Mono',monospace;background:transparent;border:1px solid var(--line);
    color:var(--parchment-dim);padding:5px 10px;border-radius:var(--radius);
  }
  .media-toggle button.active{border-color:var(--brass-dim);color:var(--brass-bright);}
  input[type=file]{width:100%;font-size:12px;color:var(--parchment-dim);font-family:'IBM Plex Mono',monospace;}
  .file-status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--moss);margin-top:6px;}
  .file-error{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#d99;margin-top:6px;}
  .prereq-box{border:1px solid var(--line);border-radius:var(--radius);padding:12px;max-height:180px;overflow:auto;background:var(--bg);}
  .prereq-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;flex-wrap:wrap;}
  .prereq-item select{
    background:var(--bg-panel-raised);border:1px solid var(--line);color:var(--parchment-dim);
    font-size:11px;padding:2px 4px;border-radius:2px;font-family:'IBM Plex Mono',monospace;
  }
  .choice-editor-card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--bg);}
  .choice-editor-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .choice-editor-row input{flex:1;}
  .small-x{background:transparent;border:1px solid var(--line);color:var(--parchment-dim);width:28px;height:28px;border-radius:var(--radius);font-size:14px;flex:none;}
  .small-x:hover{border-color:var(--wine);color:#d99;}
  .node-manage-list{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;}
  .node-manage-item{
    display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);
    font-size:13.5px;flex-wrap:wrap;gap:8px;
  }
  .node-manage-item .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .node-manage-item .pid, .pid{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--locked);}
  .node-manage-item .right{display:flex;gap:8px;}
  .node-manage-item{cursor:grab;border-radius:var(--radius);transition:border-color .12s;}
  .node-manage-item:active{cursor:grabbing;}
  .drag-handle{color:var(--locked);cursor:grab;font-size:14px;letter-spacing:-1px;}
  .node-group-bucket{padding-left:6px;border-left:2px solid var(--line);margin:0 0 10px 4px;min-height:8px;}
  .group-header{
    display:flex;align-items:center;gap:8px;padding:8px 4px;margin-top:6px;
    background:var(--bg-panel-raised);border-radius:var(--radius);cursor:grab;font-size:13px;
  }
  .group-header:active{cursor:grabbing;}
  .group-header .group-name{font-family:'Cinzel',serif;color:var(--brass-bright);font-size:13px;}
  .group-toggle{background:none;border:none;color:var(--parchment-dim);font-size:12px;cursor:pointer;padding:0 4px;}
  .hint{font-size:12px;color:var(--locked);margin-top:4px;line-height:1.5;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg-panel-raised);
    border:1px solid var(--brass-dim);color:var(--parchment);padding:10px 18px;border-radius:var(--radius);
    font-size:13px;z-index:100;box-shadow:var(--shadow);max-width:80vw;text-align:center;
  }
  .loading-note{color:var(--parchment-dim);font-size:13px;padding:40px;text-align:center;}
</style>
</head>
<body>
<div id="app"><div class="loading-note">Opening the codex…</div></div>

<script>
(function(){
  "use strict";

  // ---------------- Storage helpers ----------------
    window.storage = {
      set:(k,v)=>{
        localStorage.setItem(k,v)
        return localStorage.getItem(k).length
      },
      get: k=>localStorage.getItem(k)
    }

  async function sGet(key){
    try{ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  async function sSet(key, val){
    try{ const r = await window.storage.set(key, JSON.stringify(val)); return !!r; }
    catch(e){ console.error("storage set failed", key, e); return false; }
  }
  async function sDel(key){ try{ await window.storage.delete(key); }catch(e){} }

  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  const fmtBytes = (n) => n > 1024*1024 ? (n/1024/1024).toFixed(1)+' MB' : Math.round(n/1024)+' KB';
  function joinSubdirPath(subdir, filename){
    const dir = (subdir||'').trim().replace(/^\/+/,'').replace(/\/+$/,'');
    return dir ? dir + '/' + filename : filename;
  }

  // ---------------- Limits ----------------
  const MAX_AUDIO_BYTES = 3.2 * 1024 * 1024;   // raw file, before base64 inflation
  const MAX_IMAGE_DIM = 1280;                   // px, longest side after compression
  const IMAGE_QUALITY = 0.82;

  const DEFAULT_SETTINGS = {
    hideCompleted:false,
    hideLockedInMap:true,
    autoCloseOnAudioEnd:false,
    theme:'dark',
    mapOrientation:'horizontal',
    autoAdvance:false,
    revealChoicesWhenDone:false,
    tickSoundEnabled:true,
    scratchSoundEnabled:true,
    logOrder:'latestFirst',
    audioPlayerStyle:'native',
    animationsEnabled:true
  };

  // ---------------- State ----------------
  let games = [];
  let nodesByGame = {};
  let progress = {completed:{}};
  let settings = Object.assign({}, DEFAULT_SETTINGS);

  let route = {view:'library', gameId:null};
  let manageMode = false;
  let readerNode = null;
  let readerResult = null; // {text, advanceTo} shown after a choice is played
  let readerAutoPlay = false; // consumed once by renderReader to autoplay audio
  let editingNodeId = null; // node currently being edited in manage panel, or null = "add new"
  let gameSubView = 'shelf';
  let undoStack = []; // [{nodeId, previous}] for progress changes, most recent last
  let lastEditedNodeId = null; // most recently saved narration, for the Shift+↓ quick-chain fast key
  let seenAvailableIds = new Set(); // node ids already shown as available — anything new here gets the unlock animation once

  // inline (card / map) audio preview
  const inlineAudio = new Audio();
  let inlinePlayingId = null;
  let inlineAutoComplete = false; // true only for map "graph" plays with no choices to pick
  inlineAudio.addEventListener('ended', async ()=>{
    const finishedId = inlinePlayingId;
    const shouldComplete = inlineAutoComplete;
    inlinePlayingId = null;
    inlineAutoComplete = false;
    if(shouldComplete && finishedId){
      const node = findNodeById(finishedId);
      if(node && !isCompleted(node.id) && !(node.choices && node.choices.length)){
        await markCompletedAndFindNext(node, null);
        toast('Marked as heard — new narrations may be available.');
      }
    }
    render();
  });

  // ---------------- Load ----------------
  async function loadAll(){
    const gameIndex = await sGet('game-index') || [];
    games = [];
    for(const id of gameIndex){ const g = await sGet('game:'+id); if(g) games.push(g); }
    nodesByGame = {};
    for(const g of games){
      const nodeIndex = await sGet('node-index:'+g.id) || [];
      const list = [];
      for(const nid of nodeIndex){ const n = await sGet('node:'+nid); if(n) list.push(n); }
      nodesByGame[g.id] = list;
    }
    progress = await sGet('progress') || {completed:{}};
    settings = Object.assign({}, DEFAULT_SETTINGS, await sGet('settings') || {});
    applyTheme();
    // seed with everything already available so nothing "unlock-animates" on first load —
    // only genuinely new unlocks during this session should get the animation.
    games.forEach(g=>{
      (nodesByGame[g.id]||[]).forEach(n=>{ if(isAvailable(n)) seenAvailableIds.add(n.id); });
    });
    render();
  }

  function applyTheme(){
    document.body.classList.toggle('light', settings.theme==='light');
  }

  // ---------------- Unlock logic ----------------
  function findNodeById(id){
    for(const gid in nodesByGame){
      const found = (nodesByGame[gid]||[]).find(n=>n.id===id);
      if(found) return found;
    }
    return null;
  }
  function completionRecord(nodeId){ return progress.completed[nodeId]; }
  // Normalizes a node's prerequisites to always carry a group ('all' or 'any'), for backward
  // compatibility with older saved data that used a single node.prerequisiteMode instead.
  function normalizedPrereqs(node){
    const legacyMode = node.prerequisiteMode==='any' ? 'any' : 'all';
    return (node.prerequisites||[]).map(p=> ({...p, group: p.group || legacyMode}));
  }
  // True once a node's own AND/OR prerequisites are satisfied — independent of whether the
  // node itself has been explicitly marked heard. Shared by isAvailable() and, for
  // "completed by default" nodes, by isCompleted() itself.
  function prerequisitesSatisfiedFor(node){
    const prereqs = normalizedPrereqs(node);
    if(prereqs.length===0) return true;
    const allGroup = prereqs.filter(p=>p.group!=='any');
    const anyGroup = prereqs.filter(p=>p.group==='any');
    const allOk = allGroup.every(prereqSatisfied);
    const anyOk = anyGroup.length===0 || anyGroup.some(prereqSatisfied);
    return allOk && anyOk;
  }
  const completedByDefaultGuard = new Set(); // cycle protection while resolving auto-complete chains
  function isCompleted(nodeId){
    if(progress.completed[nodeId]) return true;
    const node = findNodeById(nodeId);
    if(node && node.completedByDefault){
      if(completedByDefaultGuard.has(nodeId)) return false; // break accidental prerequisite cycles
      completedByDefaultGuard.add(nodeId);
      const result = prerequisitesSatisfiedFor(node);
      completedByDefaultGuard.delete(nodeId);
      return result;
    }
    return false;
  }
  function prereqSatisfied(p){
    if(!isCompleted(p.nodeId)) return false;
    if(p.choiceId){
      const rec = completionRecord(p.nodeId);
      if(!rec) return false;
      if(Array.isArray(rec.choiceIds)) return rec.choiceIds.includes(p.choiceId);
      return rec.choiceId === p.choiceId;
    }
    return true;
  }
  function isAvailable(node){
    if(isCompleted(node.id)) return true;
    return prerequisitesSatisfiedFor(node);
  }
  // Direct children that list this node as one of their prerequisites, and are currently
  // available-but-not-completed and not hidden — used for "proceed" / junction navigation.
  function findChildrenUnlockedBy(node){
    return (nodesByGame[node.gameId]||[]).filter(c=>
      !c.hidden &&
      (c.prerequisites||[]).some(p=>p.nodeId===node.id) &&
      isAvailable(c) && !isCompleted(c.id)
    );
  }
  // choiceIdOrIds is a single choiceId (single-choice narrations) or an array (multi-choice).
  async function markCompleted(node, choiceIdOrIds){
    undoStack.push({nodeId: node.id, previous: progress.completed[node.id] ? {...progress.completed[node.id]} : null});
    if(undoStack.length>25) undoStack.shift();
    const isMulti = Array.isArray(choiceIdOrIds);
    progress.completed[node.id] = {
      completedAt: Date.now(),
      choiceId: isMulti ? null : (choiceIdOrIds || null),
      choiceIds: isMulti ? choiceIdOrIds : null
    };
    if(!node.hidden && (node.logMode||'full')!=='none') playScratchSound();
    await sSet('progress', progress);
  }
  async function undoLast(){
    if(undoStack.length===0) return;
    const last = undoStack.pop();
    if(last.previous){ progress.completed[last.nodeId] = last.previous; }
    else { delete progress.completed[last.nodeId]; }
    await sSet('progress', progress);
    toast('Last action undone.');
    render();
  }
  function availabilitySnapshot(gameId, excludeId){
    const map = {};
    (nodesByGame[gameId]||[]).forEach(n=>{ if(n.id!==excludeId) map[n.id] = isAvailable(n); });
    return map;
  }
  // Marks a node complete and, if exactly one other narration newly unlocked as a result, returns it.
  async function markCompletedAndFindNext(node, choiceId){
    const before = availabilitySnapshot(node.gameId, node.id);
    await markCompleted(node, choiceId);
    const after = availabilitySnapshot(node.gameId, node.id);
    const newlyUnlocked = Object.keys(after).filter(id=> after[id] && !before[id]);
    if(newlyUnlocked.length===1){
      return (nodesByGame[node.gameId]||[]).find(n=>n.id===newlyUnlocked[0]) || null;
    }
    return null;
  }
  // Skips through any chain of "completed by default" junction nodes to find the real
  // narration to show; returns null if the chain dead-ends or forks (multiple next options).
  function resolveJunctions(node){
    let current = node, guard = 0;
    while(current && current.completedByDefault && guard++<25){
      const kids = findChildrenUnlockedBy(current);
      current = kids.length===1 ? kids[0] : null;
    }
    return current;
  }
  // A short synthesized "tick" — no audio file needed, so it works fully offline.
  let tickAudioCtx = null;
  function playTickSound(){
    if(!settings.tickSoundEnabled) return;
    try{
      if(!tickAudioCtx) tickAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(tickAudioCtx.state === 'suspended') tickAudioCtx.resume();
      const now = tickAudioCtx.currentTime;
      const osc = tickAudioCtx.createOscillator();
      const gain = tickAudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1500, now);
      osc.frequency.exponentialRampToValueAtTime(850, now + 0.06);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.16, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
      osc.connect(gain).connect(tickAudioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }catch(e){ /* audio context may be blocked until a user gesture — safe to ignore */ }
  }
  // A short synthesized "pencil scratch" — filtered noise with a few uneven strokes,
  // played when a narration is written into the log.
  function playScratchSound(){
    if(!settings.scratchSoundEnabled) return;
    try{
      if(!tickAudioCtx) tickAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(tickAudioCtx.state === 'suspended') tickAudioCtx.resume();
      const ctx = tickAudioCtx;
      const now = ctx.currentTime;
      const duration = 0.22;
      const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const bandpass = ctx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.value = 2500;
      bandpass.Q.value = 0.6;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      const strokes = 4;
      for(let s=0;s<strokes;s++){
        const stepLen = duration/strokes;
        const t0 = now + s*stepLen;
        gain.gain.exponentialRampToValueAtTime(0.07 + Math.random()*0.05, t0 + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + stepLen*0.85);
      }
      noise.connect(bandpass).connect(gain).connect(ctx.destination);
      noise.start(now);
      noise.stop(now + duration + 0.02);
    }catch(e){ /* audio context may be blocked until a user gesture — safe to ignore */ }
  }
  function openReaderFor(node, autoplay){
    const resolved = resolveJunctions(node);
    const skipped = resolved !== node;
    stopInlinePlay();
    readerNode = resolved;
    readerResult = null;
    readerAutoPlay = !!(resolved && resolved.audio && (autoplay || skipped));
    if(resolved) playTickSound();
    render();
  }
  async function saveSettings(){ await sSet('settings', settings); }

  async function resetAllProgress(){
    progress = {completed:{}};
    await sSet('progress', progress);
  }
  async function resetGameProgress(gameId){
    const ids = (nodesByGame[gameId]||[]).map(n=>n.id);
    ids.forEach(id=>{ delete progress.completed[id]; });
    await sSet('progress', progress);
  }
  function exportProgress(){
    const payload = { type:'campaign-codex-progress', exportedAt: new Date().toISOString(), progress };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `campaign-codex-progress-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  function importProgressFromFile(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onerror = ()=>reject(new Error('Could not read that file.'));
      r.onload = ()=>{
        try{
          const parsed = JSON.parse(r.result);
          if(!parsed || typeof parsed !== 'object' || !parsed.progress || typeof parsed.progress.completed !== 'object'){
            reject(new Error('That file doesn\'t look like a Campaign Codex progress export.'));
            return;
          }
          resolve(parsed.progress);
        }catch(e){ reject(new Error('That file is not valid JSON.')); }
      };
      r.readAsText(file);
    });
  }

  function exportLibrary(){
    const payload = { type:'campaign-codex-library', exportedAt: new Date().toISOString(), games, nodesByGame, settings };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `campaign-codex-structure-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  function importLibraryFromFile(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onerror = ()=>reject(new Error('Could not read that file.'));
      r.onload = ()=>{
        try{
          const parsed = JSON.parse(r.result);
          if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.games) || typeof parsed.nodesByGame !== 'object'){
            reject(new Error('That file doesn\'t look like a Campaign Codex structure export.'));
            return;
          }
          resolve({games: parsed.games, nodesByGame: parsed.nodesByGame, settings: (parsed.settings && typeof parsed.settings==='object') ? parsed.settings : null});
        }catch(e){ reject(new Error('That file is not valid JSON.')); }
      };
      r.readAsText(file);
    });
  }
  async function applyImportedLibrary(loaded){
    // wipe existing games/nodes from storage
    const oldIndex = await sGet('game-index') || [];
    for(const gid of oldIndex){
      const nIdx = await sGet('node-index:'+gid) || [];
      for(const nid of nIdx){ await sDel('node:'+nid); }
      await sDel('node-index:'+gid);
      await sDel('game:'+gid);
    }
    // write new games/nodes
    const newIndex = loaded.games.map(g=>g.id);
    for(const g of loaded.games){ await sSet('game:'+g.id, g); }
    await sSet('game-index', newIndex);
    for(const gid of newIndex){
      const nodeList = loaded.nodesByGame[gid] || [];
      await sSet('node-index:'+gid, nodeList.map(n=>n.id));
      for(const n of nodeList){ await sSet('node:'+n.id, n); }
    }
    games = loaded.games;
    nodesByGame = {};
    newIndex.forEach(gid=>{ nodesByGame[gid] = loaded.nodesByGame[gid] || []; });
    if(loaded.settings){
      settings = Object.assign({}, DEFAULT_SETTINGS, loaded.settings);
      await sSet('settings', settings);
      applyTheme();
    }
  }

  // ---------------- Toast ----------------
  let toastTimer=null;
  function toast(msg){
    let el = document.getElementById('toast');
    if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
    el.textContent = msg;
    el.style.display='block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.style.display='none'; }, 3200);
  }

  // ---------------- Media helpers ----------------
  function readFileAsDataUrl(file){
    return new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result);
      r.onerror = ()=>rej(new Error('Could not read that file.'));
      r.readAsDataURL(file);
    });
  }

  // Downscale + recompress an image file so it comfortably fits in storage.
  function compressImage(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error('Could not read that image.'));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=>reject(new Error('That image could not be decoded.'));
        img.onload = ()=>{
          let { width, height } = img;
          if(width > MAX_IMAGE_DIM || height > MAX_IMAGE_DIM){
            if(width >= height){ height = Math.round(height * (MAX_IMAGE_DIM/width)); width = MAX_IMAGE_DIM; }
            else { width = Math.round(width * (MAX_IMAGE_DIM/height)); height = MAX_IMAGE_DIM; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          let dataUrl;
          try{ dataUrl = canvas.toDataURL('image/jpeg', IMAGE_QUALITY); }
          catch(e){ reject(new Error('That image could not be processed.')); return; }
          if(dataUrl.length > 4.2*1024*1024){
            reject(new Error('Even after compressing, that image is too large to store. Try a smaller photo or paste an image URL instead.'));
            return;
          }
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function readAudioFile(file){
    if(file.size > MAX_AUDIO_BYTES){
      throw new Error(`That audio file is ${fmtBytes(file.size)} — please use a clip under ${fmtBytes(MAX_AUDIO_BYTES)}, or paste a hosted audio URL instead.`);
    }
    return readFileAsDataUrl(file);
  }
  async function readFontFile(file){
    if(file.size > MAX_FONT_BYTES){
      throw new Error(`That font file is ${fmtBytes(file.size)} — please use one under ${fmtBytes(MAX_FONT_BYTES)}, or paste a hosted or local font URL instead.`);
    }
    return readFileAsDataUrl(file);
  }

  // ---------------- Icons ----------------
  const ICON_LOCK = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const ICON_PLAY = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>';
  const ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12l6 6L20 6"/></svg>';
  const ICON_EYE_OFF = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18M10.6 10.6a2 2 0 1 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c6 0 10 7 10 7a15 15 0 0 1-4 4.6M6.2 6.2C3.6 8 2 12 2 12s4 7 10 7c1.3 0 2.5-.3 3.6-.8"/></svg>';
  const ICON_GEAR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>';
  const CREST = '<svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="#c9a24b" stroke-width="1.6"><path d="M24 4l16 6v10c0 12-7 19-16 24C15 39 8 32 8 20V10l16-6z"/><path d="M24 14v16M17 21h14" stroke-width="1.3"/></svg>';
  const ICON_MINI_PLAY = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>';
  const ICON_MINI_PAUSE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>';

  const AUDIO_PLAYER_STYLES = {
    native: {label:'Native (browser default)'},
    minimal: {label:'Minimal bar'},
    brass: {label:'Brass player'}
  };
  const ICON_PLAY_LARGE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>';
  const ICON_PAUSE_LARGE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>';
  function buildAudioMarkup(src){
    if(!src) return '';
    const style = settings.audioPlayerStyle || 'native';
    if(style==='native'){
      return `<audio controls src="${src}"></audio>`;
    }
    return `
      <div class="custom-audio-player style-${style}" id="customAudioPlayer">
        <button class="cap-play" type="button" aria-label="Play">${ICON_PLAY_LARGE}</button>
        <div class="cap-progress-track"><div class="cap-progress-fill"></div></div>
        <span class="cap-time">0:00 / 0:00</span>
      </div>
      <audio src="${src}" style="display:none;"></audio>
    `;
  }

  const TITLE_FONTS = {
    cinzel: {label:'Cinzel (default)', css:"'Cinzel', serif"},
    imfell_sc: {label:'IM Fell English SC', css:"'IM Fell English SC', serif"},
    special_elite: {label:'Special Elite (typewriter)', css:"'Special Elite', monospace"},
    cormorant: {label:'Cormorant Garamond', css:"'Cormorant Garamond', serif"},
    georgia: {label:'Georgia (system)', css:"Georgia, 'Times New Roman', serif"}
  };
  const TEXT_FONTS = {
    spectral: {label:'Spectral (default)', css:"'Spectral', serif"},
    imfell: {label:'IM Fell English', css:"'IM Fell English', serif"},
    garamond: {label:'EB Garamond', css:"'EB Garamond', serif"},
    special_elite: {label:'Special Elite (typewriter)', css:"'Special Elite', monospace"},
    system: {label:'System sans-serif', css:"-apple-system, 'Segoe UI', Arial, sans-serif"}
  };
  const MAX_FONT_BYTES = 2.5 * 1024 * 1024; // raw file, before base64 inflation
  function customFontFamily(gameId, slot){ return `gf-${slot}-${gameId}`; }
  function guessFontFormat(src){
    const s = (src||'').split('?')[0].toLowerCase();
    if(s.endsWith('.woff2') || src.startsWith('data:font/woff2') || src.startsWith('data:application/font-woff2')) return 'woff2';
    if(s.endsWith('.woff') || src.startsWith('data:font/woff') || src.startsWith('data:application/font-woff')) return 'woff';
    if(s.endsWith('.ttf') || src.startsWith('data:font/ttf')) return 'truetype';
    if(s.endsWith('.otf') || src.startsWith('data:font/otf')) return 'opentype';
    return '';
  }
  // Injects/refreshes the @font-face rule(s) for a game's custom fonts, if any.
  function ensureCustomFontFaces(game){
    if(!game) return;
    ['customTitleFont','customTextFont'].forEach(key=>{
      const cf = game[key];
      const styleId = 'ff-'+key+'-'+game.id;
      let styleEl = document.getElementById(styleId);
      if(!cf || !cf.source){
        if(styleEl) styleEl.textContent = '';
        return;
      }
      if(!styleEl){ styleEl = document.createElement('style'); styleEl.id = styleId; document.head.appendChild(styleEl); }
      const format = guessFontFormat(cf.source);
      styleEl.textContent = `@font-face{font-family:'${cf.family}';src:url('${cf.source}')${format?` format('${format}')`:''};font-display:swap;}`;
    });
  }
  const GAME_STYLES = {
    default: {label:'Default (matches app theme)'},
    crimson: {label:'Crimson', dark:{brass:'#c0524a',dim:'#8a3a34',bright:'#e0736a'}, light:{brass:'#a83a32',dim:'#c25850',bright:'#7a241d'}},
    verdant: {label:'Verdant', dark:{brass:'#6f9a52',dim:'#4c6f38',bright:'#8fc26c'}, light:{brass:'#4c7a34',dim:'#6f9a52',bright:'#375c26'}},
    azure:   {label:'Azure',   dark:{brass:'#5a8fc2',dim:'#3d648c',bright:'#7fb0e0'}, light:{brass:'#3d6f9c',dim:'#5a8fc2',bright:'#2a4d70'}},
    amethyst:{label:'Amethyst',dark:{brass:'#9a72c2',dim:'#6f4f8f',bright:'#b896e0'}, light:{brass:'#7a53a3',dim:'#9a72c2',bright:'#5c3d80'}},
    ember:   {label:'Ember',   dark:{brass:'#d98a3d',dim:'#a8611f',bright:'#f0a75c'}, light:{brass:'#b5701f',dim:'#d98a3d',bright:'#8a5316'}},
    slate:   {label:'Slate',   dark:{brass:'#8a97a8',dim:'#5f6b7a',bright:'#aab6c4'}, light:{brass:'#5f6b7a',dim:'#8a97a8',bright:'#3f4854'}}
  };
  function gameAccentVars(game){
    const key = (game && game.stylePreset) || 'default';
    const preset = GAME_STYLES[key];
    if(!preset || !preset.dark) return '';
    const set = settings.theme==='light' ? preset.light : preset.dark;
    return `--brass:${set.brass};--brass-dim:${set.dim};--brass-bright:${set.bright};`;
  }
  function gameFontStyle(game){
    ensureCustomFontFaces(game);
    let t, x;
    if(game && game.titleFont==='custom' && game.customTitleFont && game.customTitleFont.source){
      t = `'${game.customTitleFont.family}', serif`;
    } else {
      t = (TITLE_FONTS[game && game.titleFont] || TITLE_FONTS.cinzel).css;
    }
    if(game && game.textFont==='custom' && game.customTextFont && game.customTextFont.source){
      x = `'${game.customTextFont.family}', serif`;
    } else {
      x = (TEXT_FONTS[game && game.textFont] || TEXT_FONTS.spectral).css;
    }
    return `--font-title:${t};--font-text:${x};${gameAccentVars(game)}`;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Inline-only Markdown transforms (bold/italic/code/links), reused by both the full block
  // renderer below and the single-line title renderer. Raw HTML passes through untouched.
  function inlineMarkdown(t){
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }
  // Titles/names: single line, no paragraph or list wrapping, but the same inline
  // Markdown shortcuts and raw HTML support as the full renderer.
  function renderTitle(src){
    if(!src) return '';
    return inlineMarkdown(src);
  }

  // Small, dependency-free Markdown -> HTML renderer for accompanying text / choice results.
  // Raw HTML typed by the author is passed through as-is (not escaped) so it renders directly —
  // this is a single-user authoring tool, so HTML in these fields is trusted content.
  function renderMarkdown(src){
    if(!src) return '';
    const lines = src.replace(/\r\n/g,'\n').split('\n');
    let html = '';
    let inList = false;
    const inlineMd = inlineMarkdown;
    lines.forEach(line=>{
      const listMatch = line.match(/^\s*[-*]\s+(.*)/);
      if(listMatch){
        if(!inList){ html += '<ul>'; inList = true; }
        html += `<li>${inlineMd(listMatch[1])}</li>`;
        return;
      }
      if(inList){ html += '</ul>'; inList=false; }
      if(line.trim()===''){ html += '<br>'; return; }
      html += `<p>${inlineMd(line)}</p>`;
    });
    if(inList) html += '</ul>';
    return html;
  }

  // ---------------- Inline audio preview (play icon on cards / map nodes) ----------------
  function toggleInlinePlay(node, evt, autoComplete){
    if(evt){ evt.stopPropagation(); evt.preventDefault(); }
    if(!node.audio) return;
    if(inlinePlayingId === node.id){
      inlineAudio.pause();
      inlinePlayingId = null;
      inlineAutoComplete = false;
      render();
      return;
    }
    inlineAudio.pause();
    inlineAudio.src = node.audio;
    inlineAudio.currentTime = 0;
    inlinePlayingId = node.id;
    inlineAutoComplete = !!autoComplete;
    inlineAudio.play().catch(()=>{ inlinePlayingId=null; inlineAutoComplete=false; render(); });
    render();
  }
  function stopInlinePlay(){
    if(inlinePlayingId){ inlineAudio.pause(); inlinePlayingId = null; inlineAutoComplete = false; }
  }

                  <button type="button" data-m="file" class="${existingGame && existingGame.customTextFont && existingGame.customTextFont.source? '':'active'}">Upload</button>
