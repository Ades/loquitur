    `;
    document.body.appendChild(overlay);
    const close = ()=>overlay.remove();
    overlay.querySelector('#closeAddGame').onclick = close;
    overlay.querySelector('#cancelAddGame').onclick = close;
    overlay.onclick = (e)=>{ if(e.target===overlay) close(); };

    const toggles = overlay.querySelector('#ngImgToggle').querySelectorAll('button');
    const fileInp = overlay.querySelector('#ngImgFile');
    const urlInp = overlay.querySelector('#ngImgUrl');
    const pathRow = overlay.querySelector('#ngImgPathRow');
    const pathInp = overlay.querySelector('#ngImgPath');
    const status = overlay.querySelector('#ngImgStatus');
    function showOnly(mode){
      fileInp.style.display = mode==='file' ? 'block' : 'none';
      urlInp.style.display = mode==='url' ? 'block' : 'none';
      pathRow.style.display = mode==='path' ? 'block' : 'none';
    }
    toggles.forEach(b=>b.onclick=()=>{
      toggles.forEach(x=>x.classList.remove('active')); b.classList.add('active');
      status.innerHTML='';
      showOnly(b.dataset.m);
    });
    fileInp.onchange = ()=>{
      status.innerHTML = fileInp.files[0] ? `<div class="file-status">Selected: ${escapeHtml(fileInp.files[0].name)} (${fmtBytes(fileInp.files[0].size)}) — will be resized to fit.</div>` : '';
    };
    let ngImgLastPicked = '';
    const ngImgSubdirInp = overlay.querySelector('#ngImgSubdir');
    overlay.querySelector('#ngImgPathBrowse').onclick = ()=> overlay.querySelector('#ngImgPathPicker').click();
    overlay.querySelector('#ngImgPathPicker').onchange = (e)=>{
      const f = e.target.files[0];
      if(f){ ngImgLastPicked = f.name; pathInp.value = joinSubdirPath(ngImgSubdirInp.value, ngImgLastPicked); }
    };
    ngImgSubdirInp.oninput = ()=>{ if(ngImgLastPicked) pathInp.value = joinSubdirPath(ngImgSubdirInp.value, ngImgLastPicked); };
    if(existingGame && existingGame.image){ /* default 'keep' mode already hides both file/url/path */ }
    else { showOnly('file'); }

    // custom font panels: select toggles visibility, media-toggle groups behave like other file/url/path pickers
    function wireFontPanel(prefix){
      const wrap = overlay.querySelector('#ng'+prefix+'CustomWrap');
      const toggleGroup = overlay.querySelector('#ng'+prefix+'CustomToggle');
      const fFile = overlay.querySelector('#ng'+prefix+'FontFile');
      const fUrl = overlay.querySelector('#ng'+prefix+'FontUrl');
      const fPathRow = overlay.querySelector('#ng'+prefix+'FontPathRow');
      const fPath = overlay.querySelector('#ng'+prefix+'FontPath');
      const fStatus = overlay.querySelector('#ng'+prefix+'FontStatus');
      const btns = toggleGroup.querySelectorAll('button');
      btns.forEach(b=>b.onclick=()=>{
        btns.forEach(x=>x.classList.remove('active')); b.classList.add('active');
        fFile.style.display = b.dataset.m==='file' ? 'block' : 'none';
        fUrl.style.display = b.dataset.m==='url' ? 'block' : 'none';
        fPathRow.style.display = b.dataset.m==='path' ? 'block' : 'none';
      });
      fFile.onchange = ()=>{
        const f = fFile.files[0];
        if(!f){ fStatus.innerHTML=''; return; }
        if(f.size > MAX_FONT_BYTES){
          fStatus.innerHTML = `<div class="file-error">${escapeHtml(f.name)} is ${fmtBytes(f.size)} — over the ${fmtBytes(MAX_FONT_BYTES)} limit. Use a smaller file or paste a URL/path instead.</div>`;
        } else {
          fStatus.innerHTML = `<div class="file-status">Selected: ${escapeHtml(f.name)} (${fmtBytes(f.size)})</div>`;
        }
      };
      let lastPicked = '';
      const subdirInp = overlay.querySelector('#ng'+prefix+'FontSubdir');
      overlay.querySelector('#ng'+prefix+'FontPathBrowse').onclick = ()=> overlay.querySelector('#ng'+prefix+'FontPathPicker').click();
      overlay.querySelector('#ng'+prefix+'FontPathPicker').onchange = (e)=>{
        const f = e.target.files[0];
        if(f){ lastPicked = f.name; fPath.value = joinSubdirPath(subdirInp.value, lastPicked); }
      };
      subdirInp.oninput = ()=>{ if(lastPicked) fPath.value = joinSubdirPath(subdirInp.value, lastPicked); };
    }
    wireFontPanel('Title');
    wireFontPanel('Text');
    overlay.querySelector('#ngTitleFont').onchange = (e)=>{
      overlay.querySelector('#ngTitleCustomWrap').style.display = e.target.value==='custom' ? 'block' : 'none';
    };
    overlay.querySelector('#ngTextFont').onchange = (e)=>{
      overlay.querySelector('#ngTextCustomWrap').style.display = e.target.value==='custom' ? 'block' : 'none';
    };

    overlay.querySelector('#saveAddGame').onclick = async ()=>{
      const name = overlay.querySelector('#ngName').value.trim();
      if(!name){ toast('Give the game a name first.'); return; }
      const btn = overlay.querySelector('#saveAddGame');
      btn.disabled = true; btn.textContent = 'Saving…';
      let image = existingGame ? (existingGame.image||'') : '';
      const activeMode = overlay.querySelector('#ngImgToggle button.active').dataset.m;
      try{
        if(activeMode==='file' && fileInp.files[0]){
          image = await compressImage(fileInp.files[0]);
        } else if(activeMode==='url'){
          image = urlInp.value.trim();
        } else if(activeMode==='path'){
          image = pathInp.value.trim();
        } else if(activeMode==='file' && !fileInp.files[0] && !existingGame){
          image = '';
        }
      }catch(e){
        toast(e.message);
        btn.disabled=false; btn.textContent = existingGame? 'Save changes':'Save game';
        return;
      }
      const id = existingGame ? existingGame.id : uid();

      const titleFontVal = overlay.querySelector('#ngTitleFont').value;
      const textFontVal = overlay.querySelector('#ngTextFont').value;
      let customTitleFont = existingGame ? existingGame.customTitleFont : null;
      let customTextFont = existingGame ? existingGame.customTextFont : null;
      try{
        if(titleFontVal==='custom'){
          const mode = overlay.querySelector('#ngTitleCustomToggle button.active').dataset.m;
          const family = customFontFamily(id, 'title');
          if(mode==='file' && overlay.querySelector('#ngTitleFontFile').files[0]){
            customTitleFont = {family, source: await readFontFile(overlay.querySelector('#ngTitleFontFile').files[0])};
          } else if(mode==='url'){
            customTitleFont = {family, source: overlay.querySelector('#ngTitleFontUrl').value.trim()};
          } else if(mode==='path'){
            customTitleFont = {family, source: overlay.querySelector('#ngTitleFontPath').value.trim()};
          } else if(mode==='keep' && customTitleFont){
            customTitleFont = {family, source: customTitleFont.source};
          }
        }
        if(textFontVal==='custom'){
          const mode = overlay.querySelector('#ngTextCustomToggle button.active').dataset.m;
          const family = customFontFamily(id, 'text');
          if(mode==='file' && overlay.querySelector('#ngTextFontFile').files[0]){
            customTextFont = {family, source: await readFontFile(overlay.querySelector('#ngTextFontFile').files[0])};
          } else if(mode==='url'){
            customTextFont = {family, source: overlay.querySelector('#ngTextFontUrl').value.trim()};
          } else if(mode==='path'){
            customTextFont = {family, source: overlay.querySelector('#ngTextFontPath').value.trim()};
          } else if(mode==='keep' && customTextFont){
            customTextFont = {family, source: customTextFont.source};
          }
        }
      }catch(e){
        toast(e.message);
        btn.disabled=false; btn.textContent = existingGame? 'Save changes':'Save game';
        return;
      }

      const game = {
        id, name,
        description: overlay.querySelector('#ngDesc').value.trim(),
        image,
        stylePreset: overlay.querySelector('#ngStylePreset').value,
        titleFont: titleFontVal,
        textFont: textFontVal,
        customTitleFont, customTextFont,
        createdAt: existingGame ? existingGame.createdAt : Date.now()
      };
      const ok = await sSet('game:'+id, game);
      if(!ok){ toast('Could not save the game — please try again, or link the image instead of uploading it.'); btn.disabled=false; btn.textContent = existingGame? 'Save changes':'Save game'; return; }
      if(existingGame){
        games = games.map(g=> g.id===id ? game : g);
        toast('Game details updated.');
      } else {
        const idx = await sGet('game-index') || [];
        idx.push(id);
        await sSet('game-index', idx);
        games.push(game);
        nodesByGame[id] = [];
        toast('Game added to the shelf.');
      }
      close();
      render();
    };
  }

  // ---------------- Game view ----------------
  function renderGame(){
    const game = games.find(g=>g.id===route.gameId);
    const wrap = document.createElement('div');
    if(!game){ route={view:'library',gameId:null}; return renderLibrary(); }
    wrap.setAttribute('style', gameFontStyle(game));
    const nodes = nodesByGame[game.id]||[];

    const crumb = document.createElement('div');
    crumb.className='crumb';
    crumb.innerHTML = `<button id="backLib">← All games</button><span>/</span><span>${renderTitle(game.name)}</span>`;
    crumb.querySelector('#backLib').onclick = ()=>{ route={view:'library',gameId:null}; render(); };
    wrap.appendChild(crumb);

    const total = nodes.length;
    const completedCount = nodes.filter(n=>isCompleted(n.id)).length;
    const gh = document.createElement('div');
    gh.className='game-header';
    gh.innerHTML = `
      <div class="art" style="${game.image?`background-image:url('${game.image}')`:''}"></div>
      <div class="meta">
        <h2>${renderTitle(game.name)}</h2>
        <div class="desc">${renderMarkdown(game.description||'')}</div>
        <div class="progress-bar"><div class="fill" style="width:${total? (completedCount/total*100):0}%"></div></div>
        <div class="progress-label">${completedCount} OF ${total} NARRATIONS HEARD</div>
      </div>
    `;
    wrap.appendChild(gh);

    if(manageMode){ wrap.appendChild(renderManagePanel(game)); }

    const toolbar = document.createElement('div');
    toolbar.className='toolbar-row';
    const toggle = document.createElement('div');
    toggle.className='view-toggle';
    toggle.innerHTML = `
      <button data-v="shelf" class="${gameSubView==='shelf'?'active':''}">Shelf</button>
      <button data-v="map" class="${gameSubView==='map'?'active':''}">Campaign map</button>
      <button data-v="log" class="${gameSubView==='log'?'active':''}">Log</button>
    `;
    toggle.querySelectorAll('button').forEach(b=>b.onclick=()=>{ gameSubView=b.dataset.v; render(); });
    toolbar.appendChild(toggle);
    wrap.appendChild(toolbar);

    if(gameSubView==='shelf'){ wrap.appendChild(renderNodeShelf(nodes, game)); }
    else if(gameSubView==='map'){ wrap.appendChild(renderCampaignMap(nodes, game)); }
    else { wrap.appendChild(renderLog(nodes)); }

    return wrap;
  }

  // ---------------- Log ----------------
  function renderLog(nodes){
    const box = document.createElement('div');
    const visible = manageMode ? nodes : nodes.filter(n=>!n.hidden);
    const entries = visible
      .filter(n=>isCompleted(n.id))
      .filter(n=> manageMode || (n.logMode||'full') !== 'none')
      .map(n=>({node:n, record: completionRecord(n.id) || {completedAt:0, choiceId:null}}))
      .sort((a,b)=> settings.logOrder==='latestLast'
        ? (a.record.completedAt||0) - (b.record.completedAt||0)
        : (b.record.completedAt||0) - (a.record.completedAt||0));

    if(entries.length===0){
      box.className='empty';
      box.innerHTML = `<h3>The log is empty</h3><p>Choices and heard narrations will be recorded here as you play.</p>`;
      return box;
    }

    const list = document.createElement('div');
    list.className='log-list';
    entries.forEach(({node,record})=>{
        if ((node.choices||[]).find(c=>c.id===record.choiceId)?.label === 'Otherwise proceed...') return
      const item = document.createElement('div');
      item.className='log-item';
      const when = record.completedAt ? new Date(record.completedAt).toLocaleString() : 'Available from the start';
      const mode = node.logMode || 'full';
      const skippedNote = (manageMode && mode==='none') ? `<div class="log-result" style="color:#d99;">Not logged for players (set to "Don't log")</div>` : '';

      if(mode==='titleOnly'){
        item.innerHTML = `
          <div class="log-top">
            <span class="log-title">${renderTitle(node.title)}</span>
            <span class="log-time">${escapeHtml(when)}</span>
          </div>
          ${skippedNote}
        `;
        list.appendChild(item);
        return;
      }
      if(mode==='textOnly'){
        item.innerHTML = `
          <div class="log-top" style="align-items:flex-start;">
            <div class="log-result" style="margin:0;flex:1;">${renderMarkdown(node.text||'')}</div>
            <span class="log-time">${escapeHtml(when)}</span>
          </div>
          ${skippedNote}
        `;
        list.appendChild(item);
        return;
      }

      let choiceLine = '';
      let resultLine = '';
      let choicesLength = 0;
      if(Array.isArray(record.choiceIds) && record.choiceIds.length){
        const chosen = (node.choices||[]).filter(c=>record.choiceIds.includes(c.id));
        choicesLength = chosen.length
        if(chosen.length){
          choiceLine = `<div class="log-choice"><i>${chosen.map(c=>`“${escapeHtml(c.label)}”`).join('</i><br/><i> ')}</i></div>`;
          const texts = chosen.filter(c=>c.resultText).map(c=>renderMarkdown(c.resultText));
          if(texts.length) resultLine = `<div class="log-result">${texts.join('')}</div>`;
        }
      } else if(record.choiceId){
        const c = (node.choices||[]).find(c=>c.id===record.choiceId);
        if(c){
            choicesLength = 1
          choiceLine = `<div class="log-choice"><i>“${escapeHtml(c.label)}”</i></div>`;
          if(c.resultText) resultLine = `<div class="log-result">${renderMarkdown(c.resultText)}</div>`;
        }
      }
      if(mode==='choicesOnly') {
          if(choicesLength > 0 || manageMode) {
            item.innerHTML = `
          <div class="log-top" style="align-items:flex-start;">
            ${choiceLine}
            <span class="log-time">${escapeHtml(when)}</span>
          </div>
          ${skippedNote}
        `;
            list.appendChild(item);
            return;
        } else {
          return
        }
      }

        item.innerHTML = `
        <div class="log-top">
          <span class="log-title">${renderTitle(node.title)}</span>
          <span class="log-time">${escapeHtml(when)}</span>
        </div>
        ${choiceLine}
        ${resultLine}
        ${skippedNote}
      `;
      list.appendChild(item);
    });
    box.appendChild(list);
    return box;
  }

  function renderNodeShelf(nodes, game){
    const box = document.createElement('div');
    const visible = manageMode ? nodes : nodes.filter(n=>!n.hidden);
    let available = visible.filter(isAvailable);
    const lockedCount = visible.length - available.length;
    if(settings.hideCompleted){ available = available.filter(n=>!isCompleted(n.id)); }

    if(visible.length===0){
      box.className='empty';
      box.innerHTML = `<h3>No narrations yet</h3><p>Use "Manage codex" above to add the first one.</p>`;
      return box;
    }
    if(available.length===0){
      box.className='empty';
      box.innerHTML = settings.hideCompleted
        ? `<h3>All caught up</h3><p>You've heard everything currently available. Uncheck "Hide narrations you've already heard" to browse them again.</p>`
        : `<h3>Nothing available yet</h3><p>${lockedCount} narration${lockedCount===1?'':'s'} will unlock as the campaign continues.</p>`;
      return box;
    }

    function buildGrid(list){
      const grid = document.createElement('div');
      grid.className='node-grid';
      list
        .sort((a,b)=> (isCompleted(a.id)===isCompleted(b.id) ? 0 : (isCompleted(a.id)?1:-1)) || ((a.order||0)-(b.order||0)))
        .forEach(n=>{
          const done = isCompleted(n.id);
          const playing = inlinePlayingId === n.id;
          const wasSeen = seenAvailableIds.has(n.id);
          if(!wasSeen) seenAvailableIds.add(n.id);
          const isNew = settings.animationsEnabled && !manageMode && !done && !wasSeen;
          const card = document.createElement('div');
          card.className = 'node-card ' + (done?'completed':'available') + (isNew?' newly-unlocked':'');
          card.innerHTML = `
            <span class="icon-row">${done?ICON_CHECK:ICON_PLAY}</span>
            <span class="tag">${done?'Heard':'Available'}</span>
            ${manageMode && n.hidden? `<span class="tag" style="background:rgba(138,58,58,.18);color:#d99;margin-left:6px;">Hidden</span>`:''}
            ${manageMode && n.completedByDefault? `<span class="tag" style="background:rgba(111,138,83,.18);color:var(--moss);margin-left:6px;">Auto</span>`:''}
            <h3>${renderTitle(n.title)}</h3>
            <div class="node-card-text">${renderMarkdown(n.text||'')}</div>
            ${n.audio? `<button class="mini-play ${playing?'playing':''}" title="${playing?'Pause preview':'Play narration'}">${playing?ICON_MINI_PAUSE:ICON_MINI_PLAY}</button>` : ''}
          `;
          card.onclick = ()=>{ openReaderFor(n, false); };
          const playBtn = card.querySelector('.mini-play');
          if(playBtn){ playBtn.onclick = (e)=> toggleInlinePlay(n, e, true); }
          grid.appendChild(card);
        });
      return grid;
    }

    const groups = game.groups || [];
    if(groups.length===0){
      box.appendChild(buildGrid(available));
    } else {
      const validGroupIds = groups.map(g=>g.id);
      const ungrouped = available.filter(n=> !n.groupId || !validGroupIds.includes(n.groupId));
      const sections = [];
      if(ungrouped.length) sections.push({id:null, name:'Ungrouped', collapsed:false, list:ungrouped});
      groups.forEach(g=>{
        const list = available.filter(n=>n.groupId===g.id);
        if(list.length) sections.push({id:g.id, name:g.name, collapsed:!!g.collapsed, list});
      });
      sections.forEach(sec=>{
        const header = document.createElement('div');
        header.className='group-header';
        header.style.cursor = sec.id===null ? 'default' : 'pointer';
        header.innerHTML = sec.id===null
          ? `<span class="group-name">Ungrouped</span><span class="pid" style="margin-left:8px;">${sec.list.length}</span>`
          : `<button class="group-toggle" type="button">${sec.collapsed?'▸':'▾'}</button><span class="group-name">${escapeHtml(sec.name)}</span><span class="pid" style="margin-left:8px;">${sec.list.length}</span>`;
        box.appendChild(header);
        if(!sec.collapsed) box.appendChild(buildGrid(sec.list));
        if(sec.id!==null){
          const openHeader = ()=>{
            header.querySelector('.group-toggle').onclick = async ()=>{
              const g = groups.find(x=>x.id===sec.id);
              if(g){ g.collapsed = !g.collapsed; await sSet('game:'+game.id, game); render(); }
            };
          };
          openHeader();
        }
      });
    }

    if(lockedCount>0){
      const note = document.createElement('div');
      note.className='locked-note';
      note.innerHTML = `${ICON_LOCK} ${lockedCount} more narration${lockedCount===1?'':'s'} will unlock as the campaign continues.`;
      box.appendChild(note);
    }
    return box;
  }

  // ---------------- Campaign map ----------------
  function hexToRgba(hex, alpha){
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  function mapPalette(game){
    const base = settings.theme==='light'
      ? { doneFill:'rgba(75,107,52,.14)', doneStroke:'#4b6b34', availFill:'rgba(138,97,20,.10)', availStroke:'#8a6114',
          lockedFill:'rgba(168,152,114,.20)', lockedStroke:'#a89872', textAvail:'#2b2013', textLocked:'#8a7c5c',
          connDone:'#a9812c', connLocked:'#c9b57e', orLabel:'#8a6114' }
      : { doneFill:'rgba(111,138,83,.16)', doneStroke:'#6f8a53', availFill:'rgba(201,162,75,.12)', availStroke:'#c9a24b',
          lockedFill:'rgba(74,64,56,.25)', lockedStroke:'#4a4038', textAvail:'#ece1c4', textLocked:'#7a7160',
          connDone:'#8c7431', connLocked:'#3a3128', orLabel:'#8c7431' };
    const key = (game && game.stylePreset) || 'default';
    const preset = GAME_STYLES[key];
    if(preset && preset.dark){
      const set = settings.theme==='light' ? preset.light : preset.dark;
      base.availStroke = set.brass;
      base.connDone = set.dim;
      base.orLabel = set.brass;
      base.availFill = hexToRgba(set.brass, settings.theme==='light'?0.10:0.12);
    }
    return base;
  }

  // Wraps a title into up to maxLines lines of roughly maxChars characters each,
  // breaking on word boundaries and ellipsizing anything left over.
  function wrapLines(text, maxChars, maxLines){
    const words = (text||'').split(/\s+/).filter(Boolean);
    if(words.length===0) return [''];
    const lines = [];
    let cur = '';
    let idx = 0;
    while(idx < words.length && lines.length < maxLines){
      let w = words[idx];
      if(w.length > maxChars) w = w.slice(0, maxChars);
      const test = cur ? cur + ' ' + w : w;
      if(test.length <= maxChars){ cur = test; idx++; }
      else if(!cur){ cur = w; idx++; }
      else { lines.push(cur); cur=''; }
    }
    if(cur && lines.length < maxLines) lines.push(cur);
    const overflow = idx < words.length;
    if(overflow){
      if(lines.length===0) lines.push('…');
      else {
        let last = lines[lines.length-1];
        if(last.length > maxChars-1) last = last.slice(0, maxChars-1);
        lines[lines.length-1] = last + '…';
      }
    }
    return lines;
  }

  function renderCampaignMapCore(nodes, game){
    const wrap = document.createElement('div');
    if(nodes.length===0){
      wrap.innerHTML = '<div class="empty" style="border:none;">Add narrations to see the campaign map.</div>';
      return wrap;
    }
    if(manageMode){
      const hint = document.createElement('div');
      hint.className='map-hint';
      hint.textContent = 'In manage mode: click any node to edit it, including its prerequisites and choices.';
      wrap.appendChild(hint);
    }

    const mapBox = document.createElement('div');
    mapBox.className='map-wrap';

    let visibleNodes = nodes;
    let hiddenLockedCount = 0;
    if(!manageMode){
      visibleNodes = nodes.filter(n=>{
        if(n.hidden) return false;
        if(settings.hideCompleted && isCompleted(n.id)) return false;
        if(settings.hideLockedInMap && !isAvailable(n)){ hiddenLockedCount++; return false; }
        return true;
      });
    }
    if(!manageMode && hiddenLockedCount>0){
      const hint = document.createElement('div');
      hint.className='map-hint';
      hint.innerHTML = `${ICON_LOCK} ${hiddenLockedCount} narration${hiddenLockedCount===1?'':'s'} further ahead are hidden until unlocked.`;
      wrap.appendChild(hint);
    }

    const idToNode = {}; nodes.forEach(n=>idToNode[n.id]=n);
    function depth(n, seen){
      seen = seen || new Set();
      if(seen.has(n.id)) return 0;
      seen.add(n.id);
      if(!n.prerequisites || n.prerequisites.length===0) return 0;
      let m = 0;
      n.prerequisites.forEach(p=>{ const pn = idToNode[p.nodeId]; if(pn) m = Math.max(m, depth(pn, seen)+1); });
      return m;
    }
    const layers = {};
    visibleNodes.forEach(n=>{ const d = depth(n); layers[d] = layers[d]||[]; layers[d].push(n); });
    const layerKeys = Object.keys(layers).map(Number).sort((a,b)=>a-b);
    if(layerKeys.length===0){
      mapBox.innerHTML = '<div class="empty" style="border:none;">Nothing to show with the current filter.</div>';
      wrap.appendChild(mapBox);
      return wrap;
    }

    const isVertical = settings.mapOrientation==='vertical';
    const boxW = 56, boxH = 100; // anchor sizing: circle diameter (+buffer) x full slot height incl. label
    const circleR = 24;
    const primaryStep = isVertical ? 150 : 190;   // spacing between successive layers (depth)
    const secondaryStep = isVertical ? 170 : 150;  // spacing between siblings within a layer
    const padX = 46, padY = 50;
    const maxRows = Math.max(...layerKeys.map(k=>layers[k].length));
    const svgW = isVertical ? padX*2 + secondaryStep*maxRows : padX*2 + primaryStep*layerKeys.length;
    const svgH = isVertical ? padY*2 + primaryStep*layerKeys.length : padY*2 + secondaryStep*maxRows;

    const pos = {};
    layerKeys.forEach((k,ci)=>{
      const rows = layers[k].length;
      const secOffset = (maxRows - rows) * secondaryStep / 2;
      layers[k].forEach((n,ri)=>{
        if(isVertical){
          pos[n.id] = { x: padX + secOffset + ri*secondaryStep + secondaryStep/2, y: padY + ci*primaryStep + primaryStep/2 };
        } else {
          pos[n.id] = { x: padX + ci*primaryStep + primaryStep/2, y: padY + secOffset + ri*secondaryStep + secondaryStep/2 };
        }
      });
    });

    const pal = mapPalette(game);
    let lines = '';
    visibleNodes.forEach(n=>{
      normalizedPrereqs(n).forEach(p=>{
        const from = pos[p.nodeId], to = pos[n.id];
        if(!from||!to) return;
        const label = p.choiceId ? (()=>{ const pn=idToNode[p.nodeId]; const c=pn&&pn.choices&&pn.choices.find(c=>c.id===p.choiceId); return c?c.label:''; })() : '';
        const stroke = isCompleted(p.nodeId) ? pal.connDone : pal.connLocked;
        let d, labelX, labelY;
        if(isVertical){
          const midy = (from.y+to.y)/2;
          d = `M${from.x},${from.y+boxH/2} C${from.x},${midy} ${to.x},${midy} ${to.x},${to.y-boxH/2}`;
          labelX = (from.x+to.x)/2; labelY = midy - 6;
        } else {
          const midx = (from.x+to.x)/2;
          d = `M${from.x+circleR},${from.y} C${midx},${from.y} ${midx},${to.y} ${to.x-circleR},${to.y}`;
          labelX = midx; labelY = (from.y+to.y)/2 - 6;
        }
        lines += `<path d="${d}" stroke="${stroke}" stroke-width="1.4" fill="none" ${p.group==='any'?'stroke-dasharray="4 3"':''}/>`;
        if(label){
          lines += `<text x="${labelX}" y="${labelY}" text-anchor="middle" font-size="9" class="map-node-label" fill="${pal.connDone}" style="font-style:italic;">${escapeHtml(label)}</text>`;
        }
      });
    });

    // Strips HTML/markdown syntax down to plain text for a compact map preview.
    function plainPreview(src){
      return (src||'').replace(/<[^>]+>/g,' ').replace(/[*`_#>]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').trim();
      // return (src||'').replace(/<[^>]+>/g,' ').replace(/[*`_#>]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ').trim();
    }

    let boxes = '';
    visibleNodes.forEach(n=>{
      const p = pos[n.id];
      const done = isCompleted(n.id);
      const avail = isAvailable(n);
      const normPrereqs = normalizedPrereqs(n);
      const anyCount = normPrereqs.filter(p=>p.group==='any').length;
      const allCount = normPrereqs.length - anyCount;
      const isOr = anyCount>0;
      const orLabelText = (allCount>0 && anyCount>0) ? `all ${allCount} + any 1 of ${anyCount}` : (anyCount>1 ? 'any one of' : '');
      const fill = done ? pal.doneFill : (avail ? pal.availFill : pal.lockedFill);
      const stroke = done ? pal.doneStroke : (avail ? pal.availStroke : pal.lockedStroke);
      const textColor = avail ? pal.textAvail : pal.textLocked;
      const showPlay = !manageMode && n.audio && avail;
      const playing = inlinePlayingId === n.id;
      const statusWord = done?'HEARD':avail?'AVAILABLE':'LOCKED';
      let tooltipBody;
      if(n.mapTooltip==='textOnly' && n.text) tooltipBody = plainPreview(n.text);
      else if(n.mapTooltip==='full' && n.text) tooltipBody = `${n.title} — ${statusWord}\n\n${plainPreview(n.text)}`;
      else tooltipBody = `${n.title} — ${statusWord}`;
      const tooltip = `<title>${escapeHtml(tooltipBody)}</title>`;
      const shapeMode = n.mapShape==='playIcon' ? 'playIcon' : (n.mapShape==='box' ? 'box' : (n.mapShape==='labelOnly' ? 'labelOnly' : 'circle'));
      const labelMode = n.mapLabel || 'title';
      const asPlayIcon = shapeMode==='playIcon' && !!n.audio;
      const iconColor = (done||avail) ? '#161109' : pal.textLocked;

      // label source text, per the node's chosen label mode (used below the small shapes, or inside the box)
      let labelSrc = '';
      if(labelMode==='title') labelSrc = n.title;
      else if(labelMode==='text') labelSrc = plainPreview(n.text);
      else if(labelMode==='choices') labelSrc = (n.choices||[]).map(c=>c.label).join(' / ');

      let shapeSvg, labelSvg, orSvg;

      if(shapeMode==='labelOnly'){
        // no shape at all — just the wrapped label text, color-coded by status since there's no fill to rely on
        const src = (labelMode==='none' || !labelSrc) ? n.title : labelSrc;
        const lines = wrapLines(src, 20, 2);
        const blockY = lines.length<=1 ? p.y+3 : p.y-4;
        shapeSvg = showPlay ? `
          <g class="map-mini-play" data-id="${n.id}" style="cursor:pointer;">
            <circle cx="${p.x}" cy="${blockY - 20}" r="9" fill="${playing?pal.doneStroke:pal.availStroke}"/>
            ${playing
              ? `<rect x="${p.x-3}" y="${blockY-24}" width="2.5" height="8" fill="#161109"/><rect x="${p.x+1.5}" y="${blockY-24}" width="2.5" height="8" fill="#161109"/>`
              : `<path d="M${p.x-2.5},${blockY-25} l8,5 l-8,5 z" fill="#161109"/>`}
          </g>` : '';
        labelSvg = lines.map((line,i)=>
          `<text x="${p.x}" y="${blockY + i*14}" text-anchor="middle" font-size="12" class="map-node-label" fill="${stroke}">${escapeHtml(line)}</text>`
        ).join('');
        orSvg = orLabelText? `<text x="${p.x}" y="${blockY-34}" text-anchor="middle" font-size="8.5" class="map-node-label" fill="${pal.orLabel}" style="letter-spacing:.06em;font-style:italic;">${escapeHtml(orLabelText)}</text>`:'';
      } else if(shapeMode==='box'){
        const bw = 132, bh = 60;
        const lines = labelMode==='none' ? [] : wrapLines(labelSrc, 17, 2);
        const titleBlockY = lines.length<=1 ? p.y - 2 : p.y - 11;
        shapeSvg = `<rect x="${p.x-bw/2}" y="${p.y-bh/2}" width="${bw}" height="${bh}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="1.4" stroke-dasharray="${isOr?'4 3':'0'}"/>`;
        labelSvg = lines.map((line,i)=>
          `<text x="${p.x}" y="${titleBlockY + i*14}" text-anchor="middle" font-size="11" class="map-node-label" fill="${textColor}">${escapeHtml(line)}</text>`
        ).join('') + `<text x="${p.x}" y="${p.y+bh/2-8}" text-anchor="middle" font-size="9" class="map-node-label" fill="${stroke}" style="letter-spacing:.06em;">${statusWord}</text>`;
        if(showPlay){
          shapeSvg += `
            <g class="map-mini-play" data-id="${n.id}" style="cursor:pointer;">
              <circle cx="${p.x+bw/2-12}" cy="${p.y-bh/2+12}" r="9" fill="${playing?pal.doneStroke:pal.availStroke}" stroke="${fill}" stroke-width="1"/>
              ${playing
                ? `<rect x="${p.x+bw/2-15}" y="${p.y-bh/2+8}" width="2.5" height="8" fill="#161109"/><rect x="${p.x+bw/2-10}" y="${p.y-bh/2+8}" width="2.5" height="8" fill="#161109"/>`
                : `<path d="M${p.x+bw/2-15.5},${p.y-bh/2+7} l9,5 l-9,5 z" fill="#161109"/>`}
            </g>`;
        }
        orSvg = orLabelText? `<text x="${p.x}" y="${p.y-bh/2-8}" text-anchor="middle" font-size="8.5" class="map-node-label" fill="${pal.orLabel}" style="letter-spacing:.06em;font-style:italic;">${escapeHtml(orLabelText)}</text>`:'';
      } else {
        // the circle (or play-icon, or its no-audio dot fallback), centered at p.x,p.y
        const isDotFallback = shapeMode==='playIcon' && !n.audio;
        const r = isDotFallback ? 9 : circleR;
        shapeSvg = `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.6" stroke-dasharray="${isOr?'3 3':'0'}"/>`;
        if(asPlayIcon){
          shapeSvg += `
            <g class="${showPlay?'map-mini-play':''}" data-id="${n.id}" style="cursor:${showPlay?'pointer':'inherit'};">
              <circle cx="${p.x}" cy="${p.y}" r="${circleR-6}" fill="${stroke}" opacity="${avail?1:0.55}"/>
              ${playing
                ? `<rect x="${p.x-6}" y="${p.y-7}" width="4" height="14" fill="${iconColor}"/><rect x="${p.x+2}" y="${p.y-7}" width="4" height="14" fill="${iconColor}"/>`
                : `<path d="M${p.x-6},${p.y-8} L${p.x+9},${p.y} L${p.x-6},${p.y+8} Z" fill="${iconColor}"/>`}
            </g>`;
        } else if(showPlay){
          // plain circle, but still offer the click-to-preview control as a small corner badge
          shapeSvg += `
            <g class="map-mini-play" data-id="${n.id}" style="cursor:pointer;">
              <circle cx="${p.x+circleR-8}" cy="${p.y-circleR+8}" r="9" fill="${playing?pal.doneStroke:pal.availStroke}" stroke="${fill}" stroke-width="1"/>
              ${playing
                ? `<rect x="${p.x+circleR-11}" y="${p.y-circleR+4}" width="2.5" height="8" fill="#161109"/><rect x="${p.x+circleR-6}" y="${p.y-circleR+4}" width="2.5" height="8" fill="#161109"/>`
                : `<path d="M${p.x+circleR-11},${p.y-circleR+3} l9,5 l-9,5 z" fill="#161109"/>`}
            </g>`;
        }

        // label text below the shape, per the node's chosen label mode
        const labelLines = labelMode==='none' ? [] : wrapLines(labelSrc, 16, 2);
        const labelTop = p.y + circleR + 13;
        labelSvg = labelLines.map((line,i)=>
          `<text x="${p.x}" y="${labelTop + i*13}" text-anchor="middle" font-size="10.5" class="map-node-label" fill="${textColor}">${escapeHtml(line)}</text>`
        ).join('');

        orSvg = orLabelText? `<text x="${p.x}" y="${p.y-circleR-9}" text-anchor="middle" font-size="8.5" class="map-node-label" fill="${pal.orLabel}" style="letter-spacing:.06em;font-style:italic;">${escapeHtml(orLabelText)}</text>`:'';
      }

      const mapWasSeen = seenAvailableIds.has(n.id);
      if(avail && !mapWasSeen) seenAvailableIds.add(n.id);
      const isNewMapNode = settings.animationsEnabled && !manageMode && !done && avail && !mapWasSeen;
      boxes += `<g class="map-node${isNewMapNode?' newly-unlocked':''}" data-id="${n.id}" style="cursor:${(avail||manageMode)?'pointer':'default'}">${tooltip}${orSvg}${shapeSvg}${labelSvg}</g>`;
    });

    mapBox.innerHTML = `<svg viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}" style="${isVertical? 'display:block;margin:0 auto;':''}">${lines}${boxes}</svg>`;
    mapBox.querySelectorAll('.map-mini-play').forEach(g=>{
      g.addEventListener('click', (e)=>{
        e.stopPropagation();
        const n = idToNode[g.dataset.id];
        toggleInlinePlay(n, e, true);
      });
    });
    mapBox.querySelectorAll('.map-node').forEach(g=>{
      const id = g.dataset.id;
      const n = idToNode[id];
      if(manageMode){
        g.addEventListener('click', ()=>{ editingNodeId = id; render(); scrollToManagePanel(); });
      } else if(isAvailable(n)){
        g.addEventListener('click', ()=>{ openReaderFor(n, false); });
      }
    });
    wrap.appendChild(mapBox);
    return wrap;
  }

  // Wraps the core single-canvas map renderer with collapsible folders matching
  // Manage Codex's groups, for the player-facing view. Manage mode always shows
  // the full unified graph (folders would hide structure you need while editing).
  function renderCampaignMap(nodes, game){
    if(nodes.length===0){
      const empty = document.createElement('div');
      empty.innerHTML = '<div class="empty" style="border:none;">Add narrations to see the campaign map.</div>';
      return empty;
    }
    const groups = game.groups || [];
    if(manageMode || groups.length===0){
      return renderCampaignMapCore(nodes, game);
    }
    const wrap = document.createElement('div');
    const validGroupIds = groups.map(g=>g.id);
    const ungrouped = nodes.filter(n=> !n.groupId || !validGroupIds.includes(n.groupId));
    const sections = [];
    if(ungrouped.length) sections.push({id:null, name:'Ungrouped', collapsed:false, list:ungrouped});
    groups.forEach(g=>{
      const list = nodes.filter(n=>n.groupId===g.id);
      if(list.length) sections.push({id:g.id, name:g.name, collapsed:!!g.collapsed, list});
    });
    sections.forEach(sec=>{
      const header = document.createElement('div');
      header.className='group-header';
      header.style.cursor = sec.id===null ? 'default' : 'pointer';
      header.innerHTML = sec.id===null
        ? `<span class="group-name">Ungrouped</span>`
        : `<button class="group-toggle" type="button">${sec.collapsed?'▸':'▾'}</button><span class="group-name">${escapeHtml(sec.name)}</span>`;
      wrap.appendChild(header);
      if(!sec.collapsed){
        wrap.appendChild(renderCampaignMapCore(sec.list, game));
      }
      if(sec.id!==null){
        header.querySelector('.group-toggle').onclick = async ()=>{
          const g = groups.find(x=>x.id===sec.id);
          if(g){ g.collapsed = !g.collapsed; await sSet('game:'+game.id, game); render(); }
        };
      }
    });
    return wrap;
  }

  function scrollToManagePanel(){
    setTimeout(()=>{
      const el = document.querySelector('.manage-panel');
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }, 30);
  }

  // ---------------- Reader overlay ----------------
  function renderReader(){
    const n = readerNode;
    stopInlinePlay();
    const overlay = document.createElement('div');
    overlay.className='reader-overlay' + (settings.animationsEnabled ? ' anim-in' : '');
    overlay.id='narrationReaderOverlay';
    const done = isCompleted(n.id);
    const hasChoices = n.choices && n.choices.length>0;

    const closeAndRerender = ()=>{ readerNode=null; readerResult=null; readerAutoPlay=false; overlay.remove(); render(); };
    const advanceTo = (nextNode)=>{ openReaderFor(nextNode, true); };

    const pos = n.image ? (n.imagePosition || 'top') : 'top';
    const isRow = n.image && (pos==='left' || pos==='right');
    const artHtml = n.image
      ? (isRow
          ? `<div class="art" style="background-image:url('${n.image}');width:100%;height:100%;min-height:220px;"></div>`
          : `<div class="art" style="background-image:url('${n.image}')"></div>`)
      : '';
    const contentHtml = `
      <div class="content">
        <h2>${renderTitle(n.title)}</h2>
        ${(!readerResult && n.audio) ? buildAudioMarkup(n.audio) : ''}
        ${(!readerResult && !n.audio) ? `<div class="hint" style="margin-bottom:16px;">No audio attached to this narration.</div>` : ''}
        ${!readerResult ? `<div class="body-text">${renderMarkdown(n.text||'')}</div>` : ''}
        <div id="readerAction"></div>
      </div>
    `;

    let bodyMarkup;
    if(isRow){
      bodyMarkup = `
        <div class="reader-relative" style="display:flex;flex-direction:${pos==='left'?'row':'row-reverse'};max-height:92vh;overflow:hidden;">
          <div style="flex:0 0 34%;align-self:stretch;">${artHtml}</div>
          <div style="flex:1;min-width:0;max-height:92vh;overflow:auto;">${contentHtml}</div>
          <button class="close" id="closeReader">&times;</button>
        </div>`;
    } else if(pos==='bottom'){
      bodyMarkup = `<div class="reader-relative">${contentHtml}${artHtml}<button class="close" id="closeReader">&times;</button></div>`;
    } else {
      bodyMarkup = `<div class="reader-relative">${artHtml}<button class="close" id="closeReader">&times;</button>${contentHtml}</div>`;
    }
    overlay.innerHTML = `<div class="reader">${bodyMarkup}</div>`;
    const ownerGame = games.find(g=>g.id===n.gameId);
    overlay.querySelector('.reader').setAttribute('style', gameFontStyle(ownerGame));

    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) closeAndRerender(); };
    overlay.querySelector('#closeReader').onclick = closeAndRerender;

    const audioEl = overlay.querySelector('audio');
    const capPlayer = overlay.querySelector('#customAudioPlayer');
    if(audioEl && capPlayer){
      const playBtn = capPlayer.querySelector('.cap-play');
      const fill = capPlayer.querySelector('.cap-progress-fill');
      const track = capPlayer.querySelector('.cap-progress-track');
      const timeLabel = capPlayer.querySelector('.cap-time');
      const fmtTime = (s)=>{ if(!isFinite(s)||s<0) return '0:00'; const m=Math.floor(s/60); const sec=Math.floor(s%60); return m+':'+String(sec).padStart(2,'0'); };
      const updateUI = ()=>{
        fill.style.width = (audioEl.duration? (audioEl.currentTime/audioEl.duration*100):0)+'%';
        timeLabel.textContent = fmtTime(audioEl.currentTime)+' / '+fmtTime(audioEl.duration);
        playBtn.innerHTML = (!audioEl.paused && !audioEl.ended) ? ICON_PAUSE_LARGE : ICON_PLAY_LARGE;
      };
      playBtn.onclick = ()=>{ if(audioEl.paused) audioEl.play().catch(()=>{}); else audioEl.pause(); };
      track.addEventListener('click', (e)=>{
        const rect = track.getBoundingClientRect();
        const pct = Math.min(1, Math.max(0, (e.clientX-rect.left)/rect.width));
        if(isFinite(audioEl.duration)) audioEl.currentTime = pct*audioEl.duration;
      });
      ['play','pause','timeupdate','loadedmetadata','ended'].forEach(evtName=> audioEl.addEventListener(evtName, updateUI));
      updateUI();
    }
    if(audioEl && settings.autoCloseOnAudioEnd){
      audioEl.addEventListener('ended', async ()=>{
        if(hasChoices) return; // a choice still has to be made manually
        if(!done){
          const next = await markCompletedAndFindNext(n, null);
          if(settings.autoAdvance && next){ advanceTo(next); return; }
          toast('Marked as heard — new narrations may be available.');
        }
        closeAndRerender();
      });
    }
    const shouldDelayChoices = hasChoices && !done && settings.revealChoicesWhenDone && !!n.audio;
    if(audioEl && shouldDelayChoices){
      audioEl.addEventListener('ended', ()=>{
        const box = overlay.querySelector('#readerAction');
        if(box){ box.innerHTML=''; box.appendChild(renderChoiceButtons()); }
      });
    }
    if(audioEl && readerAutoPlay){
      readerAutoPlay = false;
      audioEl.play().catch(()=>{ /* autoplay may be blocked by the browser */ });
    } else {
      readerAutoPlay = false;
    }

    const actionBox = overlay.querySelector('#readerAction');

    if(readerResult){
      actionBox.innerHTML = `
        <div class="result-box">
          <div class="result-label">What happens</div>
          <div class="result-text">${renderMarkdown(readerResult.text)}</div>
          <button class="btn primary" id="closeResult">Continue</button>
        </div>
      `;
      actionBox.querySelector('#closeResult').onclick = ()=>{
        const next = readerResult.advanceTo;
        if(settings.autoAdvance && next){ advanceTo(next); return; }
        closeAndRerender();
      };
      return overlay;
    }

    function renderChoiceButtons(){
      const box = document.createElement('div');
      box.innerHTML = `<div class="hint" style="margin-bottom:8px;">What happens next?</div>`;
      const choicesWrap = document.createElement('div');
      choicesWrap.className='choices';
      n.choices.forEach(c=>{
        const b = document.createElement('button');
        b.className='choice-btn';
        b.textContent = c.label;
        b.onclick = async ()=>{
          const next = await markCompletedAndFindNext(n, c.id);
          if(c.resultText && c.resultText.trim()){
            readerResult = {text: c.resultText.trim(), advanceTo: next};
            overlay.remove();
            render();
          } else if(settings.autoAdvance && next){
            advanceTo(next);
          } else {
            toast('Choice recorded — new narrations may be available.');
            closeAndRerender();
          }
        };
        choicesWrap.appendChild(b);
      });
      box.appendChild(choicesWrap);
      return box;
    }

    function renderMultiChoiceButtons(preselected){
      const pre = new Set(preselected||[]);
      const box = document.createElement('div');
      box.innerHTML = `<div class="hint" style="margin-bottom:8px;">Select all that apply, then continue — or leave everything unchecked if none apply.</div>`;
      const choicesWrap = document.createElement('div');
      choicesWrap.className='choices';
      const selected = new Set(pre);
      n.choices.forEach(c=>{
        const label = document.createElement('label');
        label.className='choice-btn';
        label.style.display='flex'; label.style.alignItems='center'; label.style.gap='10px';
        label.innerHTML = `<input type="checkbox" ${pre.has(c.id)?'checked':''}> <span>${escapeHtml(c.label)}</span>`;
        label.querySelector('input').onchange = (e)=>{ if(e.target.checked) selected.add(c.id); else selected.delete(c.id); };
        choicesWrap.appendChild(label);
      });
      box.appendChild(choicesWrap);
      const submitBtn = document.createElement('button');
      submitBtn.className='btn primary';
      submitBtn.style.marginTop='10px';
      submitBtn.textContent='Confirm selection';
      submitBtn.onclick = async ()=>{
        const ids = Array.from(selected);
        const next = await markCompletedAndFindNext(n, ids);
        const resultTexts = n.choices.filter(c=>ids.includes(c.id) && c.resultText && c.resultText.trim()).map(c=>c.resultText.trim());
        if(resultTexts.length){
          readerResult = {text: resultTexts.join('\n\n'), advanceTo: next};
          overlay.remove();
          render();
        } else if(settings.autoAdvance && next){
          advanceTo(next);
        } else {
          toast(ids.length ? 'Choices recorded — new narrations may be available.' : 'No answer recorded — new narrations may be available.');
          closeAndRerender();
        }
      };
      box.appendChild(submitBtn);
      return box;
    }

    function renderProceedButton(){
      const kids = findChildrenUnlockedBy(n);
      const b = document.createElement('button');
      if(kids.length===1){
        b.className='btn primary small';
        b.textContent='Continue →';
        b.onclick = ()=> openReaderFor(kids[0], true);
      } else {
        b.className='btn ghost small';
        b.textContent='Return to index';
        b.onclick = closeAndRerender;
      }
      return b;
    }

    function renderChoicesPending(){
      const box = document.createElement('div');
      box.innerHTML = `<div class="hint">Choices will appear once the narration finishes playing.</div>`;
      return box;
    }

    if(hasChoices){
      if(done){
        const rec = completionRecord(n.id) || {choiceId:null, choiceIds:null};
        const chosenList = Array.isArray(rec.choiceIds) && rec.choiceIds.length
          ? n.choices.filter(c=>rec.choiceIds.includes(c.id))
          : (n.choices.find(c=>c.id===rec.choiceId) ? [n.choices.find(c=>c.id===rec.choiceId)] : []);
        const chosenLabel = chosenList.map(c=>`"${escapeHtml(c.label)}"`).join(', ');
        const footer = document.createElement('div');
        footer.className='reader-footer';
        footer.innerHTML = `<span class="completed-pill">${ICON_CHECK} Heard — you chose ${chosenLabel||'—'}</span>`;
        const btnRow = document.createElement('span');
        btnRow.style.cssText='display:flex;gap:8px;';
        const changeBtn = document.createElement('button');
        changeBtn.className='btn ghost small';
        changeBtn.textContent='Change choice';
        changeBtn.onclick = ()=>{
          actionBox.innerHTML='';
          actionBox.appendChild(n.multiChoice ? renderMultiChoiceButtons(rec.choiceIds||[]) : renderChoiceButtons());
        };
        btnRow.appendChild(changeBtn);
        btnRow.appendChild(renderProceedButton());
        footer.appendChild(btnRow);
        actionBox.appendChild(footer);
      } else {
        actionBox.appendChild(shouldDelayChoices ? renderChoicesPending() : (n.multiChoice ? renderMultiChoiceButtons() : renderChoiceButtons()));
      }
    } else {
      if(done){
        const footer = document.createElement('div');
        footer.className='reader-footer';
        footer.innerHTML = `<span class="completed-pill">${ICON_CHECK} Marked as heard</span>`;
        footer.appendChild(renderProceedButton());
        actionBox.appendChild(footer);
      } else {
        const b = document.createElement('button');
        b.className='btn primary';
        b.textContent='Mark as heard';
        b.onclick = async ()=>{
          const next = await markCompletedAndFindNext(n, null);
          if(settings.autoAdvance && next){ advanceTo(next); return; }
          toast('Marked as heard — new narrations may be available.');
          closeAndRerender();
        };
        actionBox.appendChild(b);
      }
    }
    return overlay;
  }

  // ---------------- Manage panel (per-game): add + edit narrations ----------------
