<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campaign Codex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#181310;
      --bg-panel:#221b15;
      --bg-panel-raised:#2a2118;
      --line:#3a2f22;
      --parchment:#ece1c4;
      --parchment-dim:#b6a880;
      --brass:#c9a24b;
      --brass-dim:#8c7431;
      --brass-bright:#e2bc63;
      --locked:#4a4038;
      --locked-line:#3a3128;
      --moss:#6f8a53;
      --moss-dim:#4c5f3a;
      --wine:#8a3a3a;
      --shadow: 0 8px 24px rgba(0,0,0,.45);
      --radius: 3px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:
              radial-gradient(ellipse at top, #23190f 0%, var(--bg) 55%),
              var(--bg);
      color:var(--parchment);
      font-family:'Spectral',serif;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    ::selection{background:var(--brass-dim);color:#000;}
    .eyebrow{
      font-family:'IBM Plex Mono',monospace;
      font-size:11px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--brass-dim);
    }
    h1,h2,h3{font-family:'Cinzel',serif;font-weight:600;margin:0;letter-spacing:.02em;}
    button{font-family:'Spectral',serif;cursor:pointer;}
    a{color:var(--brass);}

    #app{max-width:1180px;margin:0 auto;padding:18px 18px 56px;}
    header.top{
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid var(--line);
      padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap;gap:14px;
    }
    header.top .brand{display:flex;align-items:center;gap:14px;}
    header.top .brand svg{flex:none;}
    header.top h1{font-size:22px;color:var(--parchment);}
    header.top .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--parchment-dim);letter-spacing:.08em;margin-top:2px;}
    .top-actions{display:flex;gap:10px;align-items:center;}

    .btn{
      background:transparent;border:1px solid var(--brass-dim);color:var(--brass-bright);
      padding:9px 16px;border-radius:var(--radius);font-size:13px;letter-spacing:.03em;
      transition:background .15s,color .15s,border-color .15s;
    }
    .btn:hover{background:var(--brass-dim);color:#161109;}
    .btn.primary{background:var(--brass);color:#161109;border-color:var(--brass);font-weight:600;}
    .btn.primary:hover{background:var(--brass-bright);border-color:var(--brass-bright);}
    .btn.ghost{border-color:var(--line);color:var(--parchment-dim);}
    .btn.ghost:hover{border-color:var(--parchment-dim);color:var(--parchment);background:transparent;}
    .btn.danger{border-color:var(--wine);color:#d99;}
    .btn.danger:hover{background:var(--wine);color:#fff;}
    .btn.small{padding:6px 11px;font-size:12px;}
    .btn:disabled{opacity:.4;cursor:not-allowed;}
    .btn:disabled:hover{background:transparent;color:var(--brass-bright);}
    .btn svg{vertical-align:-2px;margin-right:5px;}

    .library-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
    .game-card{
      background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
      overflow:hidden;cursor:pointer;position:relative;
      transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .game-card:hover{transform:translateY(-3px);border-color:var(--brass-dim);box-shadow:var(--shadow);}
    .game-card .art{
      height:104px;background:linear-gradient(160deg,#2c2318,#181310) center/cover no-repeat;
      display:flex;align-items:center;justify-content:center;color:var(--locked);
      border-bottom:1px solid var(--line);
    }
    .game-card .body{padding:10px 12px 12px;}
    .game-card h3{font-size:15px;color:var(--parchment);margin-bottom:4px;}
    .game-card p{font-size:12px;color:var(--parchment-dim);margin:0 0 8px;line-height:1.45;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .game-card .stat-row{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass-dim);
      letter-spacing:.05em;display:flex;justify-content:space-between;}
    .add-card{
      border:1px dashed var(--line);border-radius:var(--radius);display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:8px;min-height:104px;color:var(--parchment-dim);
      cursor:pointer;transition:border-color .15s,color .15s;
    }
    .add-card:hover{border-color:var(--brass-dim);color:var(--brass-bright);}
    .empty{border:1px dashed var(--line);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--parchment-dim);}
    .empty h3{color:var(--parchment);margin-bottom:6px;font-size:15px;}

    .crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12.5px;color:var(--parchment-dim);}
    .crumb button{background:none;border:none;color:var(--brass);font-size:12.5px;padding:0;}
    .game-header{display:flex;gap:14px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
    .game-header .art{
      width:64px;height:64px;border-radius:var(--radius);background:linear-gradient(160deg,#2c2318,#181310) center/cover no-repeat;
      border:1px solid var(--line);flex:none;
    }
    .game-header .meta{flex:1;min-width:220px;}
    .game-header h2{font-size:20px;color:var(--parchment);margin-bottom:3px;}
    .game-header p{color:var(--parchment-dim);font-size:13px;max-width:60ch;line-height:1.5;margin:0 0 6px;}
    .progress-bar{height:4px;background:var(--locked-line);border-radius:3px;overflow:hidden;max-width:320px;margin-top:6px;}
    .progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass-bright));}
    .progress-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass-dim);margin-top:4px;letter-spacing:.05em;}

    .toolbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:12px;}
    .view-toggle{display:flex;gap:6px;}
    .view-toggle button{
      background:transparent;border:1px solid var(--line);color:var(--parchment-dim);
      padding:7px 14px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;
      border-radius:var(--radius);
    }
    .view-toggle button.active{border-color:var(--brass);color:var(--brass-bright);}
    .setting-toggle{
      display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
      color:var(--parchment-dim);letter-spacing:.03em;cursor:pointer;user-select:none;
    }
    .setting-toggle input{accent-color:var(--brass);width:14px;height:14px;}

    .node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
    .node-card{
      background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;
      cursor:pointer;transition:border-color .15s,transform .15s;position:relative;
    }
    .node-card:hover{border-color:var(--brass-dim);transform:translateY(-2px);}
    .node-card.completed{border-color:var(--moss-dim);}
    .node-card .tag{
      font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
      display:inline-block;padding:2px 6px;border-radius:2px;margin-bottom:7px;
    }
    .node-card.completed .tag{background:rgba(111,138,83,.18);color:var(--moss);}
    .node-card.available .tag{background:rgba(201,162,75,.15);color:var(--brass);}
    .node-card h3{font-size:14.5px;color:var(--parchment);margin-bottom:4px;line-height:1.3;}
    .node-card p{font-size:12px;color:var(--parchment-dim);line-height:1.45;margin:0;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .node-card .icon-row{position:absolute;top:11px;right:11px;color:var(--brass-dim);}
    .locked-note{
      grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--locked);
      border-top:1px dashed var(--line);padding-top:10px;margin-top:2px;letter-spacing:.03em;
      display:flex;align-items:center;gap:8px;
    }

    .log-list{display:flex;flex-direction:column;gap:8px;}
    .log-item{
      background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
      padding:10px 13px;
    }
    .log-item .log-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
    .log-item .log-title{font-family:'Cinzel',serif;font-size:13.5px;color:var(--parchment);}
    .log-item .log-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--brass-dim);white-space:nowrap;letter-spacing:.03em;}
    .log-item .log-choice{font-size:12px;color:var(--brass);margin-top:3px;}
    .log-item .log-result{font-size:12px;color:var(--parchment-dim);font-style:italic;margin-top:3px;line-height:1.5;}

    .map-wrap{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;overflow:auto;}
    .map-wrap svg{display:block;}
    .map-node-label{font-family:'IBM Plex Mono',monospace;fill:var(--parchment);}
    .map-hint{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass-dim);margin-bottom:8px;letter-spacing:.03em;}

    .reader-overlay{
      position:fixed;inset:0;background:rgba(10,8,6,.72);backdrop-filter:blur(2px);
      display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;
    }
    .reader{
      background:var(--bg-panel);border:1px solid var(--brass-dim);border-radius:var(--radius);
      max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);
    }
    .reader .art{width:100%;height:160px;background:linear-gradient(160deg,#2c2318,#181310) center/cover no-repeat;border-bottom:1px solid var(--line);}
    .reader .content{padding:18px 20px 20px;}
    .reader h2{font-size:19px;color:var(--parchment);margin-bottom:10px;}
    .reader .close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.4);border:1px solid var(--line);
      color:var(--parchment-dim);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;display:flex;
      align-items:center;justify-content:center;}
    .reader-relative{position:relative;}
    .reader .body-text{font-size:15.5px;line-height:1.75;color:var(--parchment);white-space:pre-wrap;margin-bottom:20px;}
    audio{width:100%;margin-bottom:18px;filter:sepia(.2);}
    .choices{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
    .choice-btn{
      text-align:left;background:var(--bg-panel-raised);border:1px solid var(--line);color:var(--parchment);
      padding:12px 14px;border-radius:var(--radius);font-size:14px;transition:border-color .15s,background .15s;
    }
    .choice-btn:hover{border-color:var(--brass);background:#2f2519;}
    .reader-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
    .completed-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--moss);letter-spacing:.05em;}
    .result-box{
      background:var(--bg-panel-raised);border:1px solid var(--brass-dim);border-radius:var(--radius);
      padding:16px;margin-top:8px;
    }
    .result-box .result-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--brass);letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase;}
    .result-box .result-text{font-size:14.5px;line-height:1.7;color:var(--parchment);white-space:pre-wrap;margin-bottom:14px;}

    .manage-panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
    .manage-panel h3{color:var(--brass-bright);font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
    .field{margin-bottom:10px;}
    .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;
      color:var(--parchment-dim);margin-bottom:6px;text-transform:uppercase;}
    .field input[type=text], .field textarea, .field input[type=url]{
      width:100%;background:var(--bg);border:1px solid var(--line);color:var(--parchment);
      padding:10px 12px;border-radius:var(--radius);font-family:'Spectral',serif;font-size:14px;
    }
    .field textarea{min-height:80px;resize:vertical;}
    .field input:focus,.field textarea:focus{outline:none;border-color:var(--brass-dim);}
    .field-row{display:flex;gap:14px;flex-wrap:wrap;}
    .field-row .field{flex:1;min-width:220px;}
    .media-toggle{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
    .media-toggle button{
      font-size:11px;font-family:'IBM Plex Mono',monospace;background:transparent;border:1px solid var(--line);
      color:var(--parchment-dim);padding:5px 10px;border-radius:var(--radius);
    }
    .media-toggle button.active{border-color:var(--brass-dim);color:var(--brass-bright);}
    input[type=file]{width:100%;font-size:12px;color:var(--parchment-dim);font-family:'IBM Plex Mono',monospace;}
    .file-status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--moss);margin-top:6px;}
    .file-error{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#d99;margin-top:6px;}
    .prereq-box{border:1px solid var(--line);border-radius:var(--radius);padding:12px;max-height:180px;overflow:auto;background:var(--bg);}
    .prereq-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;flex-wrap:wrap;}
    .prereq-item select{
      background:var(--bg-panel-raised);border:1px solid var(--line);color:var(--parchment-dim);
      font-size:11px;padding:2px 4px;border-radius:2px;font-family:'IBM Plex Mono',monospace;
    }
    .choice-editor-card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;background:var(--bg);}
    .choice-editor-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
    .choice-editor-row input{flex:1;}
    .small-x{background:transparent;border:1px solid var(--line);color:var(--parchment-dim);width:28px;height:28px;border-radius:var(--radius);font-size:14px;flex:none;}
    .small-x:hover{border-color:var(--wine);color:#d99;}
    .node-manage-list{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;}
    .node-manage-item{
      display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);
      font-size:13.5px;flex-wrap:wrap;gap:8px;
    }
    .node-manage-item .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .node-manage-item .pid{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--locked);}
    .node-manage-item .right{display:flex;gap:8px;}
    .hint{font-size:12px;color:var(--locked);margin-top:4px;line-height:1.5;}
    .toast{
      position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg-panel-raised);
      border:1px solid var(--brass-dim);color:var(--parchment);padding:10px 18px;border-radius:var(--radius);
      font-size:13px;z-index:100;box-shadow:var(--shadow);max-width:80vw;text-align:center;
    }
    .loading-note{color:var(--parchment-dim);font-size:13px;padding:40px;text-align:center;}
  </style>
</head>
<body>
<div id="app"><div class="loading-note">Opening the codex…</div></div>

<script>
  (function(){
    "use strict";

    // ---------------- Storage helpers ----------------
    window.storage = {
      set:(k,v)=>{
        localStorage.setItem(k,v)
        return localStorage.getItem(k).length
      },
      get: k=>localStorage.getItem(k)
    }

    async function sGet(key){
      try{ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    async function sSet(key, val){
      try{ const r = await window.storage.set(key, JSON.stringify(val)); return !!r; }
      catch(e){ console.error("storage set failed", key, e); return false; }
    }
    async function sDel(key){ try{ await window.storage.delete(key); }catch(e){} }

    const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
    const fmtBytes = (n) => n > 1024*1024 ? (n/1024/1024).toFixed(1)+' MB' : Math.round(n/1024)+' KB';

    // ---------------- Limits ----------------
    const MAX_AUDIO_BYTES = 3.2 * 1024 * 1024;   // raw file, before base64 inflation
    const MAX_IMAGE_DIM = 1280;                   // px, longest side after compression
    const IMAGE_QUALITY = 0.82;

    // ---------------- State ----------------
    let games = [];
    let nodesByGame = {};
    let progress = {completed:{}};
    let settings = {hideCompleted:false};

    let route = {view:'library', gameId:null};
    let manageMode = false;
    let readerNode = null;
    let readerResult = null; // {text} shown after a choice is played
    let editingNodeId = null; // node currently being edited in manage panel, or null = "add new"
    let gameSubView = 'shelf';

    // ---------------- Load ----------------
    async function loadAll(){
      const gameIndex = await sGet('game-index') || [];
      games = [];
      for(const id of gameIndex){ const g = await sGet('game:'+id); if(g) games.push(g); }
      nodesByGame = {};
      for(const g of games){
        const nodeIndex = await sGet('node-index:'+g.id) || [];
        const list = [];
        for(const nid of nodeIndex){ const n = await sGet('node:'+nid); if(n) list.push(n); }
        nodesByGame[g.id] = list;
      }
      progress = await sGet('progress') || {completed:{}};
      settings = await sGet('settings') || {hideCompleted:false};
      render();
    }

    // ---------------- Unlock logic ----------------
    function isCompleted(nodeId){ return !!progress.completed[nodeId]; }
    function completionRecord(nodeId){ return progress.completed[nodeId]; }
    function isAvailable(node){
      if(isCompleted(node.id)) return true;
      if(!node.prerequisites || node.prerequisites.length===0) return true;
      return node.prerequisites.every(p=>{
        const rec = completionRecord(p.nodeId);
        if(!rec) return false;
        if(p.choiceId) return rec.choiceId === p.choiceId;
        return true;
      });
    }
    async function markCompleted(node, choiceId){
      progress.completed[node.id] = {completedAt: Date.now(), choiceId: choiceId || null};
      await sSet('progress', progress);
    }
    async function saveSettings(){ await sSet('settings', settings); }

    async function resetAllProgress(){
      progress = {completed:{}};
      await sSet('progress', progress);
    }
    async function resetGameProgress(gameId){
      const ids = (nodesByGame[gameId]||[]).map(n=>n.id);
      ids.forEach(id=>{ delete progress.completed[id]; });
      await sSet('progress', progress);
    }
    function exportProgress(){
      const payload = { type:'campaign-codex-progress', exportedAt: new Date().toISOString(), progress };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url; a.download = `campaign-codex-progress-${stamp}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }
    function importProgressFromFile(file){
      return new Promise((resolve,reject)=>{
        const r = new FileReader();
        r.onerror = ()=>reject(new Error('Could not read that file.'));
        r.onload = ()=>{
          try{
            const parsed = JSON.parse(r.result);
            if(!parsed || typeof parsed !== 'object' || !parsed.progress || typeof parsed.progress.completed !== 'object'){
              reject(new Error('That file doesn\'t look like a Campaign Codex progress export.'));
              return;
            }
            resolve(parsed.progress);
          }catch(e){ reject(new Error('That file is not valid JSON.')); }
        };
        r.readAsText(file);
      });
    }

    // ---------------- Toast ----------------
    let toastTimer=null;
    function toast(msg){
      let el = document.getElementById('toast');
      if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
      el.textContent = msg;
      el.style.display='block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ el.style.display='none'; }, 3200);
    }

    // ---------------- Media helpers ----------------
    function readFileAsDataUrl(file){
      return new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = ()=>res(r.result);
        r.onerror = ()=>rej(new Error('Could not read that file.'));
        r.readAsDataURL(file);
      });
    }

    // Downscale + recompress an image file so it comfortably fits in storage.
    function compressImage(file){
      return new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onerror = ()=>reject(new Error('Could not read that image.'));
        reader.onload = ()=>{
          const img = new Image();
          img.onerror = ()=>reject(new Error('That image could not be decoded.'));
          img.onload = ()=>{
            let { width, height } = img;
            if(width > MAX_IMAGE_DIM || height > MAX_IMAGE_DIM){
              if(width >= height){ height = Math.round(height * (MAX_IMAGE_DIM/width)); width = MAX_IMAGE_DIM; }
              else { width = Math.round(width * (MAX_IMAGE_DIM/height)); height = MAX_IMAGE_DIM; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            let dataUrl;
            try{ dataUrl = canvas.toDataURL('image/jpeg', IMAGE_QUALITY); }
            catch(e){ reject(new Error('That image could not be processed.')); return; }
            if(dataUrl.length > 4.2*1024*1024){
              reject(new Error('Even after compressing, that image is too large to store. Try a smaller photo or paste an image URL instead.'));
              return;
            }
            resolve(dataUrl);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function readAudioFile(file){
      if(file.size > MAX_AUDIO_BYTES){
        throw new Error(`That audio file is ${fmtBytes(file.size)} — please use a clip under ${fmtBytes(MAX_AUDIO_BYTES)}, or paste a hosted audio URL instead.`);
      }
      return readFileAsDataUrl(file);
    }

      box.appendChild(list);
      return box;

    // ---------------- Campaign map ----------------
    function renderCampaignMap(nodes, game){
      const wrap = document.createElement('div');
      if(nodes.length===0){
        wrap.innerHTML = '<div class="empty" style="border:none;">Add narrations to see the campaign map.</div>';
        return wrap;
      }
      if(manageMode){
        const hint = document.createElement('div');
        hint.className='map-hint';
        hint.textContent = 'In manage mode: click any node to edit it, including its prerequisites and choices.';
        wrap.appendChild(hint);
      }

      const mapBox = document.createElement('div');
      mapBox.className='map-wrap';

      let visibleNodes = nodes;
      if(!manageMode && settings.hideCompleted){ visibleNodes = nodes.filter(n=>!isCompleted(n.id)); }

      const idToNode = {}; nodes.forEach(n=>idToNode[n.id]=n);
      function depth(n, seen){
        seen = seen || new Set();
        if(seen.has(n.id)) return 0;
        seen.add(n.id);
        if(!n.prerequisites || n.prerequisites.length===0) return 0;
        let m = 0;
        n.prerequisites.forEach(p=>{ const pn = idToNode[p.nodeId]; if(pn) m = Math.max(m, depth(pn, seen)+1); });
        return m;
      }
      const layers = {};
      visibleNodes.forEach(n=>{ const d = depth(n); layers[d] = layers[d]||[]; layers[d].push(n); });
      const layerKeys = Object.keys(layers).map(Number).sort((a,b)=>a-b);
      if(layerKeys.length===0){
        mapBox.innerHTML = '<div class="empty" style="border:none;">Nothing to show with the current filter.</div>';
        wrap.appendChild(mapBox);
        return wrap;
      }

      const colW = 220, rowH = 92, padX = 40, padY = 40;
      const maxRows = Math.max(...layerKeys.map(k=>layers[k].length));
      const svgW = padX*2 + colW*layerKeys.length;
      const svgH = padY*2 + rowH*maxRows;

      const pos = {};
      layerKeys.forEach((k,ci)=>{
        layers[k].forEach((n,ri)=>{
          const rows = layers[k].length;
          const yOffset = (maxRows - rows) * rowH / 2;
          pos[n.id] = { x: padX + ci*colW + colW/2, y: padY + yOffset + ri*rowH + rowH/2 };
        });
      });

      let lines = '';
      visibleNodes.forEach(n=>{
        (n.prerequisites||[]).forEach(p=>{
          const from = pos[p.nodeId], to = pos[n.id];
          if(!from||!to) return;
          const midx = (from.x+to.x)/2;
          const label = p.choiceId ? (()=>{ const pn=idToNode[p.nodeId]; const c=pn&&pn.choices&&pn.choices.find(c=>c.id===p.choiceId); return c?c.label:''; })() : '';
          lines += `<path d="M${from.x+55},${from.y} C${midx},${from.y} ${midx},${to.y} ${to.x-55},${to.y}" stroke="${isCompleted(p.nodeId)?'#8c7431':'#3a3128'}" stroke-width="1.4" fill="none"/>`;
          if(label){
            lines += `<text x="${midx}" y="${(from.y+to.y)/2 - 6}" text-anchor="middle" font-size="9" class="map-node-label" fill="#8c7431" style="font-style:italic;">${escapeHtml(label)}</text>`;
          }
        });
      });

      let boxes = '';
      visibleNodes.forEach(n=>{
        const p = pos[n.id];
        const done = isCompleted(n.id);
        const avail = isAvailable(n);
        const fill = done ? 'rgba(111,138,83,.16)' : (avail ? 'rgba(201,162,75,.12)' : 'rgba(74,64,56,.25)');
        const stroke = done ? '#6f8a53' : (avail ? '#c9a24b' : '#4a4038');
        const textColor = avail ? '#ece1c4' : '#7a7160';
        const title = n.title.length>22? n.title.slice(0,21)+'…' : n.title;
        boxes += `
        <g class="map-node" data-id="${n.id}" style="cursor:${(avail||manageMode)?'pointer':'default'}">
          <rect x="${p.x-55}" y="${p.y-24}" width="110" height="48" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="1.3"/>
          <text x="${p.x}" y="${p.y+2}" text-anchor="middle" font-size="11.5" class="map-node-label" fill="${textColor}">${escapeHtml(title)}</text>
          <text x="${p.x}" y="${p.y+16}" text-anchor="middle" font-size="9" class="map-node-label" fill="${stroke}" style="letter-spacing:.05em;">${done?'HEARD':avail?'AVAILABLE':'LOCKED'}</text>
        </g>
      `;
      });

      mapBox.innerHTML = `<svg viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}">${lines}${boxes}</svg>`;
      mapBox.querySelectorAll('.map-node').forEach(g=>{
        const id = g.dataset.id;
        const n = idToNode[id];
        if(manageMode){
          g.addEventListener('click', ()=>{ editingNodeId = id; render(); scrollToManagePanel(); });
        } else if(isAvailable(n)){
          g.addEventListener('click', ()=>{ readerNode = n; readerResult=null; render(); });
        }
      });
      wrap.appendChild(mapBox);
      return wrap;
    }

    function scrollToManagePanel(){
      setTimeout(()=>{
        const el = document.querySelector('.manage-panel');
        if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      }, 30);
    }

    // ---------------- Reader overlay ----------------
    function renderReader(){
      const n = readerNode;
      const overlay = document.createElement('div');
      overlay.className='reader-overlay';
      const done = isCompleted(n.id);
      const hasChoices = n.choices && n.choices.length>0;

      const closeAndRerender = ()=>{ readerNode=null; readerResult=null; overlay.remove(); render(); };

      overlay.innerHTML = `
      <div class="reader">
        <div class="reader-relative">
          ${n.image?`<div class="art" style="background-image:url('${n.image}')"></div>`:''}
          <button class="close" id="closeReader">&times;</button>
        </div>
        <div class="content">
          <h2>${escapeHtml(n.title)}</h2>
          ${(!readerResult && n.audio) ? `<audio controls src="${n.audio}"></audio>` : ''}
          ${(!readerResult && !n.audio) ? `<div class="hint" style="margin-bottom:16px;">No audio attached to this narration.</div>` : ''}
          ${!readerResult ? `<div class="body-text">${escapeHtml(n.text||'')}</div>` : ''}
          <div id="readerAction"></div>
        </div>
      </div>
    `;
      document.body.appendChild(overlay);
      overlay.onclick = (e)=>{ if(e.target===overlay) closeAndRerender(); };
      overlay.querySelector('#closeReader').onclick = closeAndRerender;

      const actionBox = overlay.querySelector('#readerAction');

      if(readerResult){
        actionBox.innerHTML = `
        <div class="result-box">
          <div class="result-label">What happens</div>
          <div class="result-text">${escapeHtml(readerResult.text)}</div>
          <button class="btn primary" id="closeResult">Continue</button>
        </div>
      `;
        actionBox.querySelector('#closeResult').onclick = closeAndRerender;
        return overlay;
      }

      if(hasChoices){
        if(done){
          const rec = completionRecord(n.id);
          const chosen = n.choices.find(c=>c.id===rec.choiceId);
          actionBox.innerHTML = `<div class="reader-footer"><span class="completed-pill">${ICON_CHECK} Heard — you chose "${escapeHtml(chosen?chosen.label:'')}"</span></div>`;
        } else {
          const box = document.createElement('div');
          box.innerHTML = `<div class="hint" style="margin-bottom:8px;">What happens next?</div>`;
          const choicesWrap = document.createElement('div');
          choicesWrap.className='choices';
          n.choices.forEach(c=>{
            const b = document.createElement('button');
            b.className='choice-btn';
            b.textContent = c.label;
            b.onclick = async ()=>{
              await markCompleted(n, c.id);
              if(c.resultText && c.resultText.trim()){
                readerResult = {text: c.resultText.trim()};
                render();
                const newOverlay = document.querySelector('.reader-overlay');
                // renderReader() is regenerated by render()->readerNode branch, so nothing else to do here.
              } else {
                toast('Choice recorded — new narrations may be available.');
                closeAndRerender();
              }
            };
            choicesWrap.appendChild(b);
          });
          box.appendChild(choicesWrap);
          actionBox.appendChild(box);
        }
      } else {
        if(done){
          actionBox.innerHTML = `<div class="reader-footer"><span class="completed-pill">${ICON_CHECK} Marked as heard</span></div>`;
        } else {
          const b = document.createElement('button');
          b.className='btn primary';
          b.textContent='Mark as heard';
          b.onclick = async ()=>{
            await markCompleted(n, null);
            toast('Marked as heard — new narrations may be available.');
            closeAndRerender();
          };
          actionBox.appendChild(b);
        }
      }
      return overlay;
    }

    // ---------------- Manage panel (per-game): add + edit narrations ----------------
    function renderManagePanel(game){
      const nodes = nodesByGame[game.id]||[];
      const editingNode = editingNodeId ? nodes.find(n=>n.id===editingNodeId) : null;
      const panel = document.createElement('div');
      panel.className='manage-panel';

      const otherNodes = nodes.filter(n=> !editingNode || n.id !== editingNode.id);
      const existingPrereqIds = editingNode ? (editingNode.prerequisites||[]).map(p=>p.nodeId) : [];
      const existingPrereqChoice = {};
      if(editingNode){ (editingNode.prerequisites||[]).forEach(p=>{ existingPrereqChoice[p.nodeId] = p.choiceId || ''; }); }

      panel.innerHTML = `
      <h3>
        <span>${editingNode? `Editing “${escapeHtml(editingNode.title)}”` : `Add a narration to “${escapeHtml(game.name)}”`}</span>
        ${editingNode? `<button class="btn ghost small" id="cancelEdit">Cancel edit</button>` : ''}
      </h3>
      <div class="field-row">
        <div class="field"><label>Title</label><input type="text" id="nTitle" placeholder="e.g. The Sunken Shrine" value="${editingNode? escapeHtml(editingNode.title):''}"></div>
      </div>
      <div class="field"><label>Accompanying text</label><textarea id="nText" placeholder="Text shown alongside the narration">${editingNode? escapeHtml(editingNode.text||'') : ''}</textarea></div>

      <div class="field-row">
        <div class="field">
          <label>Narration audio</label>
          <div class="media-toggle" data-t="audio">
            ${editingNode && editingNode.audio? `<button type="button" class="active" data-m="keep">Keep current</button>`:''}
            <button type="button" data-m="file" class="${editingNode && editingNode.audio? '':'active'}">Upload file</button>
            <button type="button" data-m="url">Audio URL</button>
          </div>
          <input type="file" id="nAudioFile" accept="audio/*" style="${editingNode && editingNode.audio? 'display:none;':''}">
          <input type="url" id="nAudioUrl" placeholder="https://…" style="display:none;">
          <div id="nAudioStatus">${editingNode && editingNode.audio? '<div class="file-status">Current audio is attached — choose "Upload file" or "Audio URL" to replace it.</div>':''}</div>
          <div class="hint">Uploaded clips must be under ${fmtBytes(MAX_AUDIO_BYTES)}. For longer recordings, host the file elsewhere and paste its URL — no size limit for URLs.</div>
        </div>
        <div class="field">
          <label>Image (optional)</label>
          <div class="media-toggle" data-t="image">
            ${editingNode && editingNode.image? `<button type="button" class="active" data-m="keep">Keep current</button>`:''}
            <button type="button" data-m="file" class="${editingNode && editingNode.image? '':'active'}">Upload file</button>
            <button type="button" data-m="url">Image URL</button>
          </div>
          <input type="file" id="nImageFile" accept="image/*" style="${editingNode && editingNode.image? 'display:none;':''}">
          <input type="url" id="nImageUrl" placeholder="https://…" style="display:none;">
          <div id="nImageStatus">${editingNode && editingNode.image? '<div class="file-status">Current image is attached — choose "Upload file" or "Image URL" to replace it.</div>':''}</div>
          <div class="hint">Large photos are automatically resized on save.</div>
        </div>
      </div>

      <div class="field">
        <label>Unlocked only after (prerequisites)</label>
        <div class="prereq-box" id="prereqBox">
          ${otherNodes.length===0? '<div class="hint">No other narrations yet — this will be available from the start.</div>' :
              otherNodes.map(n=>{
                const checked = existingPrereqIds.includes(n.id);
                const hasChoices = n.choices && n.choices.length;
                return `
              <div class="prereq-item">
                <input type="checkbox" class="prereqCk" value="${n.id}" ${checked?'checked':''}>
                <span style="flex:1;">${escapeHtml(n.title)}</span>
                <select class="prereqChoice" data-for="${n.id}" ${checked?'':'disabled'}>
                  <option value="">any completion</option>
                  ${hasChoices? n.choices.map(c=>`<option value="${c.id}" ${existingPrereqChoice[n.id]===c.id?'selected':''}>requires choice: ${escapeHtml(c.label)}</option>`).join(''):''}
                </select>
              </div>`;
              }).join('')}
        </div>
        <div class="hint">Leave all unchecked for a narration that's available from the very start.</div>
      </div>

      <div class="field">
        <label>Branching choices (optional)</label>
        <div id="choiceEditor"></div>
        <button class="btn ghost small" id="addChoiceBtn" type="button">+ Add a choice</button>
        <div class="hint">If you add choices, the listener picks one after hearing this narration. Give each choice its own "what happens" text — it's shown right after the choice is made — and later narrations can require that specific choice.</div>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-top:6px;">
        <button class="btn primary" id="saveNode">${editingNode? 'Save changes' : 'Add narration'}</button>
      </div>

      <div class="node-manage-list">
        <div class="eyebrow" style="margin-bottom:10px;">Existing narrations</div>
        ${nodes.length===0? '<div class="hint">None yet.</div>' : nodes.map(n=>`
          <div class="node-manage-item">
            <div class="left">
              <span>${escapeHtml(n.title)}</span>
              ${n.choices&&n.choices.length? `<span class="pid">${n.choices.length} choice${n.choices.length===1?'':'s'}</span>`:''}
              ${n.prerequisites&&n.prerequisites.length? `<span class="pid">${n.prerequisites.length} prereq${n.prerequisites.length===1?'':'s'}</span>` : `<span class="pid">start node</span>`}
            </div>
            <div class="right">
              <button class="btn ghost small" data-edit="${n.id}">Edit</button>
              <button class="btn danger small" data-del="${n.id}">Remove</button>
            </div>
          </div>
        `).join('')}
        <div style="display:flex;justify-content:flex-end;margin-top:16px;">
          <button class="btn danger small" id="deleteGameBtn">Remove this game</button>
        </div>
      </div>
    `;

      if(editingNode){
        panel.querySelector('#cancelEdit').onclick = ()=>{ editingNodeId=null; render(); };
      }

      // media toggles (audio / image), each may include a "keep" option
      panel.querySelectorAll('.media-toggle').forEach(mt=>{
        const t = mt.dataset.t;
        const btns = mt.querySelectorAll('button');
        const fileInp = panel.querySelector(t==='audio'? '#nAudioFile':'#nImageFile');
        const urlInp = panel.querySelector(t==='audio'? '#nAudioUrl':'#nImageUrl');
        btns.forEach(b=>b.onclick=()=>{
          btns.forEach(x=>x.classList.remove('active')); b.classList.add('active');
          if(b.dataset.m==='keep'){ fileInp.style.display='none'; urlInp.style.display='none'; }
          else if(b.dataset.m==='file'){ fileInp.style.display='block'; urlInp.style.display='none'; }
          else { fileInp.style.display='none'; urlInp.style.display='block'; }
        });
      });
      panel.querySelector('#nAudioFile').onchange = (e)=>{
        const f = e.target.files[0];
        const statusEl = panel.querySelector('#nAudioStatus');
        if(!f){ statusEl.innerHTML=''; return; }
        if(f.size > MAX_AUDIO_BYTES){
          statusEl.innerHTML = `<div class="file-error">${escapeHtml(f.name)} is ${fmtBytes(f.size)} — over the ${fmtBytes(MAX_AUDIO_BYTES)} limit. Use a shorter clip or paste an audio URL instead.</div>`;
        } else {
          statusEl.innerHTML = `<div class="file-status">Selected: ${escapeHtml(f.name)} (${fmtBytes(f.size)})</div>`;
        }
      };
      panel.querySelector('#nImageFile').onchange = (e)=>{
        const f = e.target.files[0];
        const statusEl = panel.querySelector('#nImageStatus');
        statusEl.innerHTML = f ? `<div class="file-status">Selected: ${escapeHtml(f.name)} (${fmtBytes(f.size)}) — will be resized to fit.</div>` : '';
      };

      // prereq checkbox enabling choice dropdown
      panel.querySelectorAll('.prereqCk').forEach(ck=>{
        const sel = panel.querySelector(`.prereqChoice[data-for="${ck.value}"]`);
        ck.onchange = ()=>{ sel.disabled = !ck.checked; };
      });

      // choice editor (label + result text shown when that choice is played)
      let choiceRows = editingNode && editingNode.choices ? editingNode.choices.map(c=>({id:c.id, label:c.label, resultText:c.resultText||''})) : [];
      const choiceEditor = panel.querySelector('#choiceEditor');
      function renderChoiceRows(){
        choiceEditor.innerHTML = '';
        choiceRows.forEach((c,i)=>{
          const card = document.createElement('div');
          card.className='choice-editor-card';
          card.innerHTML = `
          <div class="choice-editor-row">
            <input type="text" value="${escapeHtml(c.label)}" placeholder="Choice label, e.g. Flee into the woods">
            <button type="button" class="small-x">×</button>
          </div>
          <textarea placeholder="What happens next — shown to the player right after they pick this choice" style="min-height:56px;">${escapeHtml(c.resultText)}</textarea>
        `;
          card.querySelector('input').oninput = (e)=>{ choiceRows[i].label = e.target.value; };
          card.querySelector('textarea').oninput = (e)=>{ choiceRows[i].resultText = e.target.value; };
          card.querySelector('.small-x').onclick = ()=>{ choiceRows.splice(i,1); renderChoiceRows(); };
          choiceEditor.appendChild(card);
        });
      }
      renderChoiceRows();
      panel.querySelector('#addChoiceBtn').onclick = ()=>{
        choiceRows.push({id:uid(), label:'', resultText:''});
        renderChoiceRows();
      };

      // save (add or update)
      panel.querySelector('#saveNode').onclick = async ()=>{
        const title = panel.querySelector('#nTitle').value.trim();
        if(!title){ toast('Give the narration a title.'); return; }
        const saveBtn = panel.querySelector('#saveNode');
        saveBtn.disabled = true; saveBtn.textContent='Saving…';

        let audio = editingNode ? (editingNode.audio||'') : '';
        let image = editingNode ? (editingNode.image||'') : '';

        try{
          const audioMode = panel.querySelector('.media-toggle[data-t="audio"] button.active').dataset.m;
          if(audioMode==='file' && panel.querySelector('#nAudioFile').files[0]){
            audio = await readAudioFile(panel.querySelector('#nAudioFile').files[0]);
          } else if(audioMode==='url'){
            audio = panel.querySelector('#nAudioUrl').value.trim();
          } else if(audioMode==='file' && !panel.querySelector('#nAudioFile').files[0] && !editingNode){
            audio = '';
          }
          const imageMode = panel.querySelector('.media-toggle[data-t="image"] button.active').dataset.m;
          if(imageMode==='file' && panel.querySelector('#nImageFile').files[0]){
            image = await compressImage(panel.querySelector('#nImageFile').files[0]);
          } else if(imageMode==='url'){
            image = panel.querySelector('#nImageUrl').value.trim();
          } else if(imageMode==='file' && !panel.querySelector('#nImageFile').files[0] && !editingNode){
            image = '';
          }
        }catch(e){
          toast(e.message);
          saveBtn.disabled=false; saveBtn.textContent = editingNode? 'Save changes':'Add narration';
          return;
        }

        const prerequisites = [];
        panel.querySelectorAll('.prereqCk').forEach(ck=>{
          if(ck.checked){
            const sel = panel.querySelector(`.prereqChoice[data-for="${ck.value}"]`);
            prerequisites.push({nodeId: ck.value, choiceId: sel.value || null});
          }
        });
        const choices = choiceRows.filter(c=>c.label.trim()).map(c=>({id:c.id, label:c.label.trim(), resultText:(c.resultText||'').trim()}));

        const id = editingNode ? editingNode.id : uid();
        const node = {
          id, gameId: game.id, title,
          text: panel.querySelector('#nText').value.trim(),
          audio, image, prerequisites, choices,
          createdAt: editingNode ? editingNode.createdAt : Date.now()
        };

        const ok = await sSet('node:'+id, node);
        if(!ok){ toast('Could not save — please try again, or use a URL instead of uploading.'); saveBtn.disabled=false; saveBtn.textContent = editingNode? 'Save changes':'Add narration'; return; }

        if(editingNode){
          nodesByGame[game.id] = nodesByGame[game.id].map(n=> n.id===id ? node : n);
          toast('Narration updated.');
          editingNodeId = null;
        } else {
          const nodeIndex = await sGet('node-index:'+game.id) || [];
          nodeIndex.push(id);
          await sSet('node-index:'+game.id, nodeIndex);
          nodesByGame[game.id].push(node);
          toast('Narration added.');
        }
        render();
      };

      // edit buttons
      panel.querySelectorAll('[data-edit]').forEach(b=>{
        b.onclick = ()=>{ editingNodeId = b.dataset.edit; render(); };
      });

      // delete node
      panel.querySelectorAll('[data-del]').forEach(b=>{
        b.onclick = async ()=>{
          const nid = b.dataset.del;
          if(!confirm('Remove this narration? Other narrations that require it will stay locked. This cannot be undone.')) return;
          await sDel('node:'+nid);
          let nodeIndex = await sGet('node-index:'+game.id) || [];
          nodeIndex = nodeIndex.filter(x=>x!==nid);
          await sSet('node-index:'+game.id, nodeIndex);
          nodesByGame[game.id] = nodesByGame[game.id].filter(n=>n.id!==nid);
          delete progress.completed[nid];
          await sSet('progress', progress);
          if(editingNodeId===nid) editingNodeId=null;
          toast('Narration removed.');
          render();
        };
      });

      // delete game
      panel.querySelector('#deleteGameBtn').onclick = async ()=>{
        if(!confirm(`Remove "${game.name}" and all its narrations? This cannot be undone.`)) return;
        for(const n of nodes){ await sDel('node:'+n.id); }
        await sDel('node-index:'+game.id);
        await sDel('game:'+game.id);
        let idx = await sGet('game-index') || [];
        idx = idx.filter(x=>x!==game.id);
        await sSet('game-index', idx);
        games = games.filter(g=>g.id!==game.id);
        delete nodesByGame[game.id];
        route = {view:'library', gameId:null};
        toast('Game removed.');
        render();
      };

      return panel;
    }

    loadAll();
  })();
</script>
</body>
</html>
